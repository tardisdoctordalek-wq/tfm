<title>나율이의 대모험</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #12131c;
  color: #cfd3e6;
  font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

#stage {
  position: relative;
  width: min(100vw, calc((100vh - 60px) * 1.875));
  aspect-ratio: 960 / 512;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: #6ec0ff;
  border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, .55);
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
}

#hint {
  margin: 0;
  font-size: 13px;
  opacity: .75;
  text-align: center;
  padding: 0 10px;
}

#hint b { color: #ffd86b; }

/* ── 모바일 터치 조작 ───────────────────────────── */
#touch {
  position: absolute;
  inset: auto 0 0 0;
  height: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 14px;
  pointer-events: none;
}

#touch.hidden { display: none; }

.pad-left, .pad-right { display: flex; gap: 12px; pointer-events: auto; }

.btn {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .55);
  background: rgba(20, 22, 40, .42);
  color: #fff;
  font-size: 24px;
  font-weight: 700;
  font-family: inherit;
  user-select: none;
  touch-action: none;
}

.btn.jump { background: rgba(255, 93, 143, .5); }
.btn.run  { background: rgba(110, 192, 255, .4); font-size: 15px; }
.btn.act  { background: rgba(79, 200, 232, .45); font-size: 15px; }
.btn:active, .btn.on { transform: scale(.93); filter: brightness(1.4); }

/* 버튼이 5개(←·→·액션·달리기·점프)라 좁은 화면에서는 줄여야 겹치지 않습니다.
   68px × 5 + 여백 = 약 404px 이라 360px 폰에서 넘칩니다. */
@media (max-width: 560px) {
  #touch { padding: 8px; }
  .pad-left, .pad-right { gap: 8px; }
  .btn { width: 54px; height: 54px; font-size: 19px; }
  .btn.run, .btn.act { font-size: 12px; }
}

@media (max-width: 400px) {
  .pad-left, .pad-right { gap: 6px; }
  .btn { width: 46px; height: 46px; font-size: 17px; }
  .btn.run, .btn.act { font-size: 10px; }
}

@media (max-height: 480px) {
  #hint { display: none; }
}

</style>

/* ===== js/audio.js ===== */
/* ============================================================
 *  효과음 / 배경음 — 오디오 파일 없이 WebAudio로 직접 소리를 만듭니다.
 * ========================================================== */

const Sound = {
  ctx: null,
  master: null,
  muted: false,
  bgmOn: false,
  _timer: null,
  _next: 0,
  _step: 0,

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.28;
    this.master.connect(this.ctx.destination);
    try {
      this.muted = localStorage.getItem('nayul_muted') === '1';
    } catch (e) { /* 저장소를 못 쓰는 환경도 있음 */ }
  },

  resume() {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  toggleMute() {
    this.muted = !this.muted;
    try { localStorage.setItem('nayul_muted', this.muted ? '1' : '0'); } catch (e) {}
    if (this.muted) { this.stopBgm(); this.vacuumOff(); }
    else if (this.bgmOn) this.startBgm();
    return this.muted;
  },

  /* 한 음 재생 */
  tone(freq, dur, type = 'square', vol = 0.5, at = 0, slideTo = null) {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + at;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(this.master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  },

  noise(dur = 0.18, vol = 0.35) {
    if (!this.ctx || this.muted) return;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource();
    const g = this.ctx.createGain();
    g.gain.value = vol;
    src.buffer = buf;
    src.connect(g).connect(this.master);
    src.start();
  },

  jump()    { this.tone(420, 0.16, 'square', 0.4, 0, 760); },
  coin()    { this.tone(1180, 0.07, 'square', 0.35); this.tone(1580, 0.12, 'square', 0.32, 0.07); },
  stomp()   { this.tone(260, 0.1, 'square', 0.4, 0, 90); this.noise(0.1, 0.2); },
  bump()    { this.tone(160, 0.08, 'square', 0.35, 0, 110); },
  brick()   { this.noise(0.22, 0.4); this.tone(200, 0.12, 'square', 0.25, 0, 70); },
  powerup() { [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.12, 'square', 0.35, i * 0.07)); },
  hurt()    { this.tone(520, 0.3, 'sawtooth', 0.35, 0, 120); },
  die()     { [660, 560, 460, 330, 220].forEach((f, i) => this.tone(f, 0.2, 'square', 0.4, i * 0.12)); },
  clear()   { [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.18, 'square', 0.38, i * 0.14)); },
  start()   { [523, 784, 1046].forEach((f, i) => this.tone(f, 0.12, 'square', 0.4, i * 0.09)); },

  /* 청소기 "웅~" 하는 모터 소리.
     버튼을 누르고 있는 동안 계속 나야 해서, 한 번 만든 노드를 켜고 끕니다.
     (프레임마다 noise() 를 새로 만들면 소리가 지직거리고 CPU 도 먹습니다.) */
  vacuumOn() {
    if (!this.ctx || this.muted || this._vacNodes) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    const lp = this.ctx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.value = 78;
    lp.type = 'lowpass';
    lp.frequency.value = 900;
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(0.16, this.ctx.currentTime + 0.08);
    osc.connect(lp).connect(g).connect(this.master);
    osc.start();
    this._vacNodes = { osc, g };
  },

  vacuumOff() {
    if (!this._vacNodes) return;
    const { osc, g } = this._vacNodes;
    this._vacNodes = null;
    try {
      g.gain.cancelScheduledValues(this.ctx.currentTime);
      g.gain.setValueAtTime(g.gain.value, this.ctx.currentTime);
      g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1);
      osc.stop(this.ctx.currentTime + 0.14);
    } catch (e) {}
  },

  /* 적이 통 안으로 빨려 들어간 순간 */
  suck()    { this.tone(300, 0.14, 'square', 0.3, 0, 1100); this.noise(0.12, 0.18); },

  /* ── 배경음: 밝은 8비트 멜로디 반복 ── */
  MELODY: [
    [659, 1], [659, 1], [0, 1], [659, 1], [0, 1], [523, 1], [659, 1], [0, 1],
    [784, 2], [0, 2], [392, 2], [0, 2],
    [523, 2], [0, 1], [392, 2], [0, 1], [330, 2], [0, 1],
    [440, 1], [494, 1], [466, 1], [440, 1],
    [392, 1], [659, 1], [784, 1], [880, 1], [0, 1],
    [698, 1], [784, 1], [0, 1], [659, 1], [0, 1], [523, 1], [587, 1], [494, 1], [0, 2],
  ],
  BASS: [131, 131, 165, 165, 196, 196, 165, 131],

  startBgm() {
    this.bgmOn = true;
    if (!this.ctx || this.muted || this._timer) return;
    this._next = this.ctx.currentTime + 0.1;
    this._step = 0;
    this._timer = setInterval(() => this._schedule(), 60);
  },

  stopBgm() {
    if (this._timer) { clearInterval(this._timer); this._timer = null; }
  },

  pauseBgm() { this.stopBgm(); },

  _schedule() {
    if (!this.ctx || this.muted) return;
    const beat = 0.14;
    while (this._next < this.ctx.currentTime + 0.3) {
      const note = this.MELODY[this._step % this.MELODY.length];
      const at = this._next - this.ctx.currentTime;
      if (note[0] > 0) this.tone(note[0], beat * note[1] * 0.85, 'square', 0.13, Math.max(0, at));
      if (this._step % 2 === 0) {
        const b = this.BASS[Math.floor(this._step / 4) % this.BASS.length];
        this.tone(b, beat * 1.6, 'triangle', 0.17, Math.max(0, at));
      }
      this._next += beat * note[1];
      this._step++;
    }
  },
};


/* ===== js/input.js ===== */
/* ============================================================
 *  키보드 + 터치 입력
 * ========================================================== */

const Input = {
  down: { left: false, right: false, jump: false, run: false, crouch: false, action: false },
  pressed: {},          // 이번 프레임에 "새로" 눌린 키
  anyPressed: false,

  KEYMAP: {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowDown: 'crouch', KeyS: 'crouch',
    Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump',
    ShiftLeft: 'run', ShiftRight: 'run', KeyX: 'run',
    KeyC: 'action', KeyF: 'action',   /* 청소기·자동차·침 같은 파워업 사용 */
  },

  /* 터치 액션 버튼의 글자를 파워업 이름으로 바꿉니다.
     아이가 지금 무엇을 쓰는 버튼인지 알아볼 수 있게 하기 위해서입니다. */
  setActionLabel(text) {
    if (this._actionBtn) this._actionBtn.textContent = text || '액션';
  },

  init() {
    addEventListener('keydown', (e) => {
      const k = this.KEYMAP[e.code];
      if (k) {
        e.preventDefault();
        if (!this.down[k]) this.pressed[k] = true;
        this.down[k] = true;
      }
      this.anyPressed = true;
      Sound.resume();
      if (e.code === 'KeyP' || e.code === 'Escape') this.pressed.pause = true;
      if (e.code === 'KeyM') this.pressed.mute = true;
      if (e.code === 'KeyR') this.pressed.restart = true;
      if (e.code === 'Enter') this.pressed.jump = true;
    });

    addEventListener('keyup', (e) => {
      const k = this.KEYMAP[e.code];
      if (k) this.down[k] = false;
    });

    addEventListener('blur', () => {
      Object.keys(this.down).forEach((k) => { this.down[k] = false; });
    });

    // 터치 버튼
    const pad = document.getElementById('touch');
    const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    if (isTouch) pad.classList.remove('hidden');

    pad.querySelectorAll('.btn').forEach((btn) => {
      const key = btn.dataset.key;
      const on = (e) => {
        e.preventDefault();
        Sound.resume();
        if (!this.down[key]) this.pressed[key] = true;
        this.down[key] = true;
        this.anyPressed = true;
        btn.classList.add('on');
      };
      const off = (e) => {
        e.preventDefault();
        this.down[key] = false;
        btn.classList.remove('on');
      };
      btn.addEventListener('pointerdown', on);
      btn.addEventListener('pointerup', off);
      btn.addEventListener('pointercancel', off);
      btn.addEventListener('pointerleave', off);
      btn.addEventListener('contextmenu', (e) => e.preventDefault());
    });

    this._actionBtn = pad.querySelector('.btn.act');

    // 캔버스를 탭해도 시작/진행되도록
    const canvas = document.getElementById('game');
    canvas.addEventListener('pointerdown', () => {
      Sound.resume();
      this.anyPressed = true;
      this.pressed.tap = true;
    });
  },

  /* 프레임이 끝날 때 "새로 눌림" 상태를 비웁니다 */
  endFrame() {
    this.pressed = {};
    this.anyPressed = false;
  },
};

/* 타일은 스테이지 테마(들판/동굴/하늘)마다 색이 바뀝니다.
 * 그래서 타일 그림은 색 글자 대신 "톤 번호"로 그립니다.
 *   1 2 3 4 = 주 재질의 밝음 / 기본 / 그늘 / 최암부
 *   5 6 7 8 = 보조 재질(잔디, 장식 등)의 밝음 / 기본 / 그늘 / 최암부
 * 테마 램프를 넣어 주면 그때 실제 색이 정해집니다.
 *
 *   drawPixels(ctx, DIRT, x, y, 2, false, tonePal(theme.dirt, theme.grass));
 */
function tonePal(main, sub) {
  const m = main || [], s = sub || [];
  return {
    '.': null,
    1: m[0], 2: m[1], 3: m[2], 4: m[3],
    5: s[0], 6: s[1], 7: s[2], 8: s[3],
  };
}


/* ===== js/sprites/core.js ===== */
/* ============================================================
 *  도트 렌더링 핵심
 *  drawPixels(ctx, grid, x, y, scale, flip, pal)
 *    grid  : 글자 배열. 글자 한 개가 도트 한 개입니다.
 *    scale : 반드시 정수 배율만 사용하세요 (1, 2, 3...).
 *    pal   : 생략하면 공용 팔레트 PAL 을 씁니다.
 *            타일처럼 테마마다 색이 달라지는 그림은 자기 팔레트를 넘깁니다.
 * ========================================================== */

function drawPixels(ctx, grid, x, y, scale, flip, pal) {
  const p = pal || PAL;
  ctx.save();
  if (flip) {
    ctx.translate(Math.round(x) + grid[0].length * scale, Math.round(y));
    ctx.scale(-1, 1);
  } else {
    ctx.translate(Math.round(x), Math.round(y));
  }
  for (let r = 0; r < grid.length; r++) {
    const line = grid[r];
    for (let c = 0; c < line.length; c++) {
      const col = p[line[c]];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(c * scale, r * scale, scale, scale);
    }
  }
  ctx.restore();
}

/* ─────────── 도형 보조 함수 ─────────── */
function rr(ctx, x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.lineTo(x + w - rad, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
  ctx.lineTo(x + w, y + h - rad);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
  ctx.lineTo(x + rad, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
  ctx.lineTo(x, y + rad);
  ctx.quadraticCurveTo(x, y, x + rad, y);
  ctx.closePath();
}

function circle(ctx, x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawStar(ctx, cx, cy, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = (Math.PI / 5) * i - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.45;
    const px = cx + Math.cos(ang) * rad;
    const py = cy + Math.sin(ang) * rad;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}

const PAL_QUESTION = { '.': null, o: '#2a1a08', a: '#ffe066', b: '#ffc022', c: '#d18a10', w: '#ffffff', d: '#8a5a08' };
const PAL_QUESTION_ON = { '.': null, o: '#2a1a08', a: '#fff4b0', b: '#ffd451', c: '#e0a020', w: '#ffffff', d: '#8a5a08' };
const PAL_ITEM = { '.': null, o: '#2a1208', a: '#ffb070', b: '#ff7a2a', c: '#c94a12', w: '#fff0a8', d: '#8a3a08' };
const PAL_ITEM_ON = { '.': null, o: '#2a1208', a: '#ffd0a0', b: '#ff9a4a', c: '#e06020', w: '#ffffff', d: '#8a3a08' };
const PAL_CLOUD = { '.': null, W: '#ffffff', B: '#ffffff', b: '#c8d8f0' };
/* 파워 블록은 민트색이라 노란 ? 블록·주황 ! 블록과 한눈에 구분됩니다 */
const PAL_POWER    = { '.': null, o: '#10283a', a: '#b8f4ff', b: '#4fc8e8', c: '#2a7fa8', w: '#ffffff' };
const PAL_POWER_ON = { '.': null, o: '#10283a', a: '#e8fdff', b: '#7fdcf2', c: '#3f9fc8', w: '#ffffff' };

/* 스테이지 테마 — 재질마다 4단 램프 */
const THEME = {
  day: {
    dirt:  ['#f0b46a', '#cf7f38', '#96501f', '#2e1608'],
    grass: ['#b6f05e', '#6ec62e', '#3f8f1c', '#1a3f0c'],
    stone: ['#f0f4ff', '#bcc8dc', '#7b8aa6', '#242c3c'],
    brick: ['#f09a6a', '#cf5f34', '#93381a', '#2c1008'],
    wood:  ['#f0c07a', '#c98a3c', '#8a5620', '#2c1808'],
    spike: ['#f0f4ff', '#aab6cc', '#6a7590', '#20283a'],
    bush:  ['#b6f05e', '#6ec62e', '#3f8f1c', '#1a3f0c'],
    sky:   ['#2f8fff', '#4c9fff', '#6fb4ff', '#98caff', '#c4e2ff'],
    hill:  ['#49a832', '#388a28', '#245f19'],
  },
  /* 1스테이지 — 집 안.
     아침 햇살이 든 거실 색입니다. 벽지는 연한 크림, 바닥은 따뜻한 나무. */
  house: {
    dirt:  ['#e8c48a', '#c99a5c', '#8f6434', '#3a2412'],   // 마룻바닥
    grass: ['#ffd9e4', '#f0a8bf', '#b0708a', '#3a2030'],   // 바닥 러그 테두리
    stone: ['#dff5ea', '#a8ddc4', '#6ba88c', '#22382e'],   // 수납장·싱크대 (연한 민트색 가구)
    brick: ['#ffd2b8', '#e89a72', '#a6613f', '#2e160c'],   // 서랍장
    wood:  ['#ffeec4', '#f5b95e', '#a86f18', '#241203'],   // 선반(얇은 발판) — 배경 가구보다 밝고 진하게
    spike: ['#ff9a9a', '#e64545', '#a01f1f', '#380c0c'],   // 레고 조각
    bush:  ['#bff09a', '#74c04e', '#417d2c', '#18300f'],   // 화분 잎
    sky:   ['#fff6e8', '#fdeedb', '#fae4cb', '#f6d9bb', '#f0cdaa'],   // 벽지
    hill:  ['#dcc3b2', '#c9ab97', '#ad8d79'],              // 배경 가구 (채도를 낮춰 뒤로 물러나게)
  },
  cave: {
    dirt:  ['#9b7fd0', '#6a55a0', '#43336c', '#160f24'],
    grass: ['#c8a8ff', '#8f6fd6', '#5b459c', '#241a3c'],
    stone: ['#dfe6ff', '#9aa6cc', '#64708f', '#1c2233'],
    brick: ['#b57fd0', '#8a4fa0', '#5a2c6c', '#1c0c24'],
    wood:  ['#c9a06a', '#966a34', '#5e4018', '#1e1206'],
    spike: ['#e8eeff', '#98a4c4', '#5a6484', '#141a2a'],
    bush:  ['#a88fd8', '#6f57a8', '#463672', '#1a1230'],
    sky:   ['#150e28', '#1c1332', '#251a42', '#2f2152', '#392962'],
    hill:  ['#3a2a66', '#2a1e4c', '#1c1436'],
  },
  sky: {
    dirt:  ['#ffd8f4', '#e6a8e0', '#b072bc', '#3f2450'],
    grass: ['#ffffff', '#e2dcff', '#aea6dc', '#4c4676'],
    stone: ['#e8f0ff', '#b9c8f0', '#7f8fc0', '#2a3050'],
    brick: ['#ffc2e2', '#e07ab4', '#a44a80', '#341a30'],
    wood:  ['#ffd8a8', '#e0a86a', '#a8703a', '#3a2010'],
    spike: ['#ffffff', '#c8d4f0', '#8f9cc0', '#2a3050'],
    bush:  ['#ffffff', '#dcd4ff', '#a89ee0', '#4a4478'],
    sky:   ['#7fd0ff', '#9adcff', '#bde8ff', '#e8dcff', '#ffdcee'],
    hill:  ['#c3aef0', '#a48ddc', '#7a68a8'],
  },
};

const TS = 2;   /* 타일 도트 배율 — 캐릭터와 같은 크기를 유지합니다 */

function drawTile(ctx, ch, px, py, th, t) {
  const c = THEME[th] || THEME.day;
  const home = th === 'house';   /* 집에서는 같은 자리에 다른 물건이 놓입니다 */
  switch (ch) {
    case '#': drawPixels(ctx, home ? T_FLOOR : T_DIRT, px, py, TS, false, tonePal(c.dirt, c.grass)); break;
    case '=': drawPixels(ctx, home ? T_WALLTILE : T_STONE, px, py, TS, false, tonePal(c.stone)); break;
    case 'B': drawPixels(ctx, home ? T_DRAWER : T_BRICK, px, py, TS, false, tonePal(c.brick)); break;
    case '?': drawPixels(ctx, T_QUESTION, px, py, TS, false,
                Math.floor(t / 26) % 2 ? PAL_QUESTION_ON : PAL_QUESTION); break;
    case '!': drawPixels(ctx, T_ITEM, px, py, TS, false,
                Math.floor(t / 20) % 2 ? PAL_ITEM_ON : PAL_ITEM); break;
    case '*': drawPixels(ctx, T_POWER, px, py, TS, false,
                Math.floor(t / 14) % 2 ? PAL_POWER_ON : PAL_POWER); break;
    case 'X': drawPixels(ctx, T_USED, px, py, TS, false, tonePal(c.brick)); break;
    case '-': drawPixels(ctx, T_PLATFORM, px, py, TS, false, tonePal(c.wood)); break;
    case '^': drawPixels(ctx, home ? T_LEGO : T_SPIKE, px, py, TS, false, tonePal(c.spike)); break;
    case 'c':
      if (home) drawPixels(ctx, T_CLOCK, px, py, TS, false, tonePal(c.wood, c.stone));
      else drawPixels(ctx, T_CLOUD, px, py, TS, false, PAL_CLOUD);
      break;
    case 't':
      if (home) drawPixels(ctx, T_PLANT, px, py + TILE - T_PLANT.length * TS, TS, false, tonePal(c.dirt, c.bush));
      else drawPixels(ctx, T_BUSH, px, py + TILE - T_BUSH.length * TS, TS, false, tonePal(c.dirt, c.bush));
      break;
    default: break;
  }
}

/* 흙 위가 비어 있으면 잔디를 덮습니다 */
function drawGrassTop(ctx, px, py, th) {
  const c = THEME[th] || THEME.day;
  /* 집에서는 잔디가 아니라 평평한 걸레받이/러그 테두리가 올라옵니다 */
  drawPixels(ctx, th === 'house' ? T_TRIM : T_GRASS, px, py, TS, false, tonePal(c.dirt, c.grass));
}

/* 골 — 테마마다 다릅니다.
   집에서는 깃발이 아니라 현관문입니다. "아빠를 따라 집을 나선다"는
   이야기가 골에서 읽혀야 하기 때문입니다. */
function drawGoal(ctx, px, py, t, th) {
  if (th === 'house') { drawDoorGoal(ctx, px, py, t); return; }
  const poleX = px + TILE / 2;
  const top = py - TILE * 4;
  ctx.fillStyle = '#20283a';
  ctx.fillRect(poleX - 4, top, 8, TILE * 5);
  ctx.fillStyle = '#bcc8dc';
  ctx.fillRect(poleX - 2, top + 2, 4, TILE * 5 - 2);
  ctx.fillStyle = '#ffc022';
  ctx.fillRect(poleX - 8, top - 8, 16, 8);
  ctx.fillStyle = '#2a1a08';
  ctx.fillRect(poleX - 8, top - 10, 16, 2);

  const wave = Math.round(Math.sin(t * 0.07) * 3) * 2;
  ctx.fillStyle = '#2a1020';
  ctx.fillRect(poleX + 4, top + 10, 44 + wave, 26);
  ctx.fillStyle = '#ff5fa8';
  ctx.fillRect(poleX + 6, top + 12, 40 + wave, 22);
  ctx.fillStyle = '#ffc2de';
  ctx.fillRect(poleX + 6, top + 12, 40 + wave, 4);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('GOAL', poleX + 26 + wave / 2, top + 24);
}

/* 현관문 (1스테이지 골).
   바닥(py + TILE)에 서 있고 높이는 4타일입니다. 깃발과 같은 자리를 차지하도록
   맞춰 두었습니다 — 충돌 상자는 js/game.js 의 goalBox 가 정합니다. */
function drawDoorGoal(ctx, px, py, t) {
  const w = 60, h = TILE * 4;
  const x = px + TILE / 2 - w / 2;
  const y = py + TILE - h;

  /* 문 뒤에서 새어 나오는 아침 햇살 — 아이가 "여기로 가면 된다"를 알아보게 */
  ctx.save();
  ctx.globalAlpha = 0.18 + Math.sin(t * 0.05) * 0.06;
  ctx.fillStyle = '#ffe9a8';
  ctx.fillRect(x - 14, y - 10, w + 28, h + 12);
  ctx.restore();

  ctx.fillStyle = '#3a2412';                      // 문틀 (최암부)
  ctx.fillRect(x - 6, y - 8, w + 12, h + 8);
  ctx.fillStyle = '#a07840';                      // 문틀 안쪽
  ctx.fillRect(x - 3, y - 5, w + 6, h + 5);
  ctx.fillStyle = '#c99a5c';                      // 문짝
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#e8c48a';                      // 위쪽 밝은 베벨
  ctx.fillRect(x, y, w, 4);
  ctx.fillRect(x, y, 4, h);
  ctx.fillStyle = '#8f6434';                      // 아래·오른쪽 그늘
  ctx.fillRect(x, y + h - 5, w, 5);
  ctx.fillRect(x + w - 5, y, 5, h);

  /* 문짝 패널 두 칸 */
  for (let i = 0; i < 2; i++) {
    const py2 = y + 14 + i * (h / 2 - 6);
    ctx.fillStyle = '#8f6434';
    ctx.fillRect(x + 10, py2, w - 20, h / 2 - 22);
    ctx.fillStyle = '#e8c48a';
    ctx.fillRect(x + 12, py2 + 2, w - 24, h / 2 - 26);
    ctx.fillStyle = '#c99a5c';
    ctx.fillRect(x + 14, py2 + 4, w - 28, h / 2 - 30);
  }

  /* 손잡이 */
  ctx.fillStyle = '#3a2412';
  ctx.beginPath(); ctx.arc(x + w - 12, y + h / 2, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd451';
  ctx.beginPath(); ctx.arc(x + w - 12, y + h / 2, 4, 0, Math.PI * 2); ctx.fill();

  /* 현관 매트 */
  ctx.fillStyle = '#3a2030';
  ctx.fillRect(x - 10, py + TILE - 8, w + 20, 8);
  ctx.fillStyle = '#f0a8bf';
  ctx.fillRect(x - 8, py + TILE - 6, w + 16, 5);

  /* 안내 글자 */
  ctx.save();
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = 'rgba(0,0,0,.55)';
  ctx.lineWidth = 4;
  ctx.fillStyle = '#fff';
  const label = '아빠한테 가자!';
  const ly = y - 20 + Math.round(Math.sin(t * 0.06) * 2);
  ctx.strokeText(label, x + w / 2, ly);
  ctx.fillText(label, x + w / 2, ly);
  ctx.restore();
}

/* ── 집 안 배경 ──
 * 언덕·구름 대신 벽지 / 액자 / 창문 / 가구 실루엣이 지나갑니다.
 * 멀리 있는 것일수록 천천히 움직이게 해서 깊이를 만듭니다. */
function drawHouseBackground(ctx, camX, c, t) {
  const bands = c.sky;
  const h = Math.ceil(VIEW_H / bands.length);
  for (let i = 0; i < bands.length; i++) {
    ctx.fillStyle = bands[i];
    ctx.fillRect(0, i * h, VIEW_W, h);
    if (i > 0) {
      ctx.fillStyle = bands[i - 1];
      for (let x = 0; x < VIEW_W; x += 8) {
        ctx.fillRect(x, i * h, 4, 4);
        ctx.fillRect(x + 4, i * h + 4, 4, 4);
      }
    }
  }

  const ground = VIEW_H - TILE * 2;

  /* 벽지 세로 줄무늬 */
  const stripeSpan = 96;
  ctx.fillStyle = 'rgba(214, 160, 120, .16)';
  for (let i = -1; i < VIEW_W / stripeSpan + 2; i++) {
    const x = i * stripeSpan - ((camX * 0.35) % stripeSpan);
    ctx.fillRect(x, 0, 22, ground);
  }

  /* 창문 — 밖은 이미 환합니다. 아빠가 벌써 나갔다는 뜻입니다. */
  const winSpan = 940;
  for (let i = 0; i < 3; i++) {
    const x = ((i * winSpan - camX * 0.3) % (winSpan * 3) + winSpan * 3) % (winSpan * 3) - 200;
    const y = 74, w = 150, hh = 130;
    ctx.fillStyle = '#7a5334'; ctx.fillRect(x - 6, y - 6, w + 12, hh + 12);
    ctx.fillStyle = '#c99a5c'; ctx.fillRect(x - 3, y - 3, w + 6, hh + 6);
    ctx.fillStyle = '#bfe6ff'; ctx.fillRect(x, y, w, hh);
    ctx.fillStyle = '#e8f6ff'; ctx.fillRect(x, y, w, hh / 2);
    ctx.fillStyle = '#7a5334';
    ctx.fillRect(x + w / 2 - 3, y, 6, hh);
    ctx.fillRect(x, y + hh / 2 - 3, w, 6);
  }

  /* 액자 */
  const frSpan = 330;
  for (let i = 0; i < 8; i++) {
    const span = frSpan * 8;
    const x = ((i * frSpan - camX * 0.3) % span + span) % span - 150;
    if (i % 3 === 1) continue;          /* 가끔 비워야 자연스럽습니다 */
    const w = i % 2 ? 62 : 46, hh = i % 2 ? 46 : 58;
    const y = 120 + (i % 3) * 26;
    ctx.fillStyle = '#5c3a1c'; ctx.fillRect(x, y, w, hh);
    ctx.fillStyle = '#e0b077'; ctx.fillRect(x + 3, y + 3, w - 6, hh - 6);
    ctx.fillStyle = ['#ffd0e0', '#cfe6ff', '#d8f0c0'][i % 3];
    ctx.fillRect(x + 7, y + 7, w - 14, hh - 14);
  }

  /* 가구 실루엣 — 바닥에 붙여 놓아야 방처럼 보입니다.
     전체를 반투명하게 깔아 "밟을 수 있는 것"과 확실히 구분합니다.
     (불투명하게 그렸더니 배경 식탁과 전경 선반이 똑같아 보였습니다) */
  ctx.save();
  ctx.globalAlpha = 0.5;
  const furSpan = 520;
  for (let i = 0; i < 8; i++) {
    const span = furSpan * 8;
    const x = ((i * furSpan - camX * 0.55) % span + span) % span - 260;
    const kind = i % 3;
    if (kind === 0) {
      /* 소파 */
      const w = 190, hh = 78, y = ground - hh;
      ctx.fillStyle = c.hill[2]; ctx.fillRect(x, y, w, hh);
      ctx.fillStyle = c.hill[0]; ctx.fillRect(x + 4, y + 4, w - 8, 26);
      ctx.fillStyle = c.hill[1]; ctx.fillRect(x + 4, y + 30, w - 8, hh - 34);
      ctx.fillStyle = c.hill[2];
      ctx.fillRect(x, y + 20, 22, hh - 20);
      ctx.fillRect(x + w - 22, y + 20, 22, hh - 20);
      ctx.fillRect(x + w / 2 - 2, y + 30, 4, hh - 34);
    } else if (kind === 1) {
      /* 책장 */
      const w = 120, hh = 160, y = ground - hh;
      ctx.fillStyle = c.hill[2]; ctx.fillRect(x, y, w, hh);
      ctx.fillStyle = c.hill[1]; ctx.fillRect(x + 5, y + 5, w - 10, hh - 10);
      for (let k = 0; k < 3; k++) {
        const sy = y + 12 + k * ((hh - 20) / 3);
        ctx.fillStyle = c.hill[2];
        ctx.fillRect(x + 5, sy + (hh - 20) / 3 - 6, w - 10, 6);
        for (let b = 0; b < 5; b++) {
          ctx.fillStyle = ['#d9a79c', '#9fb2cc', '#d8c9a0', '#a8c4ac', '#bfaacc'][(k + b) % 5];
          ctx.fillRect(x + 10 + b * 20, sy, 14, (hh - 20) / 3 - 8);
        }
      }
    } else {
      /* 식탁 */
      const w = 160, hh = 92, y = ground - hh;
      ctx.fillStyle = c.hill[2]; ctx.fillRect(x, y, w, 14);
      ctx.fillStyle = c.hill[0]; ctx.fillRect(x + 3, y + 2, w - 6, 6);
      ctx.fillStyle = c.hill[1];
      ctx.fillRect(x + 14, y + 14, 12, hh - 14);
      ctx.fillRect(x + w - 26, y + 14, 12, hh - 14);
    }
  }

  ctx.restore();

  /* 벽과 바닥이 만나는 걸레받이 */
  ctx.fillStyle = c.hill[2];
  ctx.fillRect(0, ground - 10, VIEW_W, 10);
  ctx.fillStyle = c.hill[0];
  ctx.fillRect(0, ground - 10, VIEW_W, 3);
}

/* 배경 — 그라디언트 대신 색 계단 + 디더링, 테두리 있는 언덕 */
function drawBackground(ctx, camX, th, t) {
  const c = THEME[th] || THEME.day;
  if (th === 'house') { drawHouseBackground(ctx, camX, c, t); return; }
  const bands = c.sky;
  const h = Math.ceil(VIEW_H / bands.length);
  for (let i = 0; i < bands.length; i++) {
    ctx.fillStyle = bands[i];
    ctx.fillRect(0, i * h, VIEW_W, h);
    /* 경계에 체크무늬를 깔아 색 계단을 부드럽게 */
    if (i > 0) {
      ctx.fillStyle = bands[i - 1];
      for (let x = 0; x < VIEW_W; x += 8) {
        ctx.fillRect(x, i * h, 4, 4);
        ctx.fillRect(x + 4, i * h + 4, 4, 4);
      }
    }
  }

  /* 먼 언덕 */
  function hills(color, line, spacing, rad, yBase, speed) {
    const span = spacing * 8;
    for (let i = 0; i < 9; i++) {
      const x = (i * spacing - camX * speed) % span;
      const xx = ((x + span) % span) - spacing;
      ctx.fillStyle = line;
      ctx.beginPath(); ctx.arc(xx, yBase + 4, rad + 4, Math.PI, 0); ctx.fill();
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(xx, yBase + 4, rad, Math.PI, 0); ctx.fill();
    }
  }
  /* 땅(잔디)보다 위에서 끝나게 해서 지면이 묻히지 않도록 합니다 */
  const ground = VIEW_H - TILE * 2;
  hills(c.hill[2], c.hill[2], 360, 120, ground - 44, 0.25);
  hills(c.hill[1], c.hill[2], 300, 92, ground - 18, 0.45);
  hills(c.hill[0], c.hill[2], 260, 62, ground - 2, 0.7);

  /* 배경 구름 */
  if (th !== 'cave') {
    for (let i = 0; i < 6; i++) {
      const span = 2400;
      const x = (i * 400 - camX * 0.18) % span;
      drawPixels(ctx, T_CLOUD, ((x + span) % span) - 120, 40 + (i % 3) * 52, TS, false, PAL_CLOUD);
    }
  } else {
    for (let i = 0; i < 40; i++) {
      const span = 1600;
      const x = (i * 137 - camX * 0.2) % span;
      const y = (i * 71) % (VIEW_H - 60);
      ctx.fillStyle = i % 3 ? 'rgba(200,180,255,.5)' : 'rgba(255,255,255,.7)';
      ctx.fillRect(((x + span) % span), y, 2, 2);
    }
  }
}

function drawWalker(ctx, x, y, w, h, t, dir, squashed, theme) {
  const set = WALKER_SETS[theme] || { walk: WALKER, flat: WALKER_FLAT };
  const g = squashed ? set.flat : set.walk[Math.floor(t / 12) % set.walk.length];
  const s = 2;
  const sw = g[0].length * s;
  ctx.fillStyle = 'rgba(0,0,0,.20)';
  ctx.beginPath();
  ctx.ellipse(x + w / 2, y + h, w * 0.45, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  drawPixels(ctx, g, x + w / 2 - sw / 2, y + h - g.length * s, s, dir < 0);
}

/*
 * o = { facing, state('idle'|'run'|'jump'|'hurt'), t, big, blink }
 * (x, y, w, h) 는 충돌 상자. 도트 그림은 그 상자 가운데/바닥에 맞춰 그립니다.
 *
 * 프레임 세트에 넣을 수 있는 이름
 *   idle           서 있기 (필수)
 *   blink          눈 감은 서 있기 (없으면 깜빡이지 않습니다)
 *   walk1 ~ walk4  걷기 (있는 만큼 순서대로 돌립니다. 넘기는 속도는
 *                  o.walkT — 실제로 걸어간 거리 — 에 맞춥니다)
 *   jump           올라갈 때
 *   fall           내려올 때 (없으면 jump 를 씁니다)
 *   skid           달리다 반대로 꺾어 미끄러질 때
 *   hurt           맞았을 때
 */
function drawNayul(ctx, x, y, w, h, o) {
  const set = (o.big && typeof NAYUL_BIG !== 'undefined') ? NAYUL_BIG : NAYUL;
  const walk = [set.walk1, set.walk2, set.walk3, set.walk4].filter(Boolean);

  let grid;
  let bounce = 0;          /* 걸을 때 몸이 내려가는 양 (화면 픽셀) */
  if (o.state === 'hurt') grid = set.hurt || set.idle;
  else if (o.state === 'skid') grid = set.skid || set.jump;
  else if (o.state === 'jump') grid = (o.vy > 1 && set.fall) ? set.fall : (set.jump || set.idle);
  else if (o.state === 'run' && walk.length) {
    /* 걸어간 거리에 맞춰 발을 바꿉니다. 느리게 걸으면 천천히, 달리면 빨라집니다.
       숫자를 키우면 더 느긋해집니다 (40 = 보통 걸음에서 그림 한 장당 약 15프레임). */
    const step = o.walkT !== undefined ? o.walkT / 40 : o.t / 14;
    const i = Math.floor(step) % walk.length;
    grid = walk[i];
    /* 다리를 벌린 프레임(0, 2)에서만 화면에서 1픽셀 내려 걸음의 무게를 줍니다.
       0 으로 바꾸면 흔들림이 완전히 사라지고, 2 로 하면 도트 한 칸만큼 커집니다. */
    if (i % 2 === 0) bounce = 1;
  }
  else if (o.blink && set.blink) grid = set.blink;
  else grid = set.idle;

  const scale = Math.max(2, Math.round(h / set.idle.length));
  const sw = grid[0].length * scale;
  const sh = grid.length * scale;
  const px = x + w / 2 - sw / 2;
  const py = y + h - sh + bounce;

  /* 그림자 */
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath();
  ctx.ellipse(x + w / 2, y + h, w * 0.5, 3.5, 0, 0, Math.PI * 2);
  ctx.fill();

  drawPixels(ctx, grid, px, py, scale, o.facing < 0);

  /* 아이템 먹어 커졌을 때: 머리 위 반짝이는 별 */
  if (o.big && set === NAYUL) {
    drawStar(ctx, x + w / 2, py - 6 + Math.sin(o.t * 0.12) * 2, 6, '#ffe66d');
  }
}

/* ============================================================
 *  파워업 — 스테이지마다 다른 "기믹" (너구리마리오식)
 *
 *  스테이지 1 (집)      청소기 : 앞쪽 적을 빨아들여 없앱니다
 *  스테이지 2 (길거리)  자동차 : (다음 작업)
 *  스테이지 3 (한방병원) 침    : (다음 작업)
 *
 *  ─ 어떤 파워가 나올지는 js/levels.js 의 레벨 정의에 `power:` 로 적습니다.
 *    같은 `*` 블록이 스테이지마다 다른 물건을 내놓습니다.
 *  ─ 파워는 "맞으면 잃습니다". 마리오 불꽃과 같은 3단 구조입니다.
 *      파워 있는 나율  →(맞음)→  큰 나율  →(맞음)→  작은 나율  →(맞음)→  죽음
 *  ─ 주인공 도트(js/sprites/player.js) 는 건드리지 않습니다.
 *    1904줄짜리 생성물이라 손에 물건을 쥔 그림을 새로 뽑으면 걷기 4프레임 ×
 *    작은/큰 상태를 전부 다시 만들어야 합니다. 그래서 물건만 나율이 위에
 *    덧그립니다. 자동차·침도 같은 방식으로 붙일 수 있습니다.
 * ========================================================== */

/* ─────────── 청소기 도트 ───────────
 * 블록에서 나왔을 때 떠 있는 모습 (16 x 16, 배율 2 → 화면 32 x 32)
 * 위로 뻗은 관 + 바닥의 넓은 흡입구. 작은 크기에서도 청소기로 읽히는 실루엣입니다. */
const VACUUM = [
  '..........@@@...',
  '.........@ii@...',
  '.........@im@...',
  '........@iim@...',
  '........@im@....',
  '.......@iim@....',
  '.......@im@.....',
  '......@iim@.....',
  '.....@@im@@.....',
  '...@@@mmmm@@@...',
  '..@iimmmmmmmm@..',
  '..@immmmmmmmm@..',
  '..@+mm++++mm+@..',
  '..@++++++++++@..',
  '..@@@@@@@@@@@@..',
  '................',
];

/* 나율이가 손에 쥐고 있는 모습 (12 x 7, 배율 2 → 화면 24 x 14)
 * 기본은 오른쪽을 보는 그림이고, 왼쪽을 볼 때는 뒤집어 그립니다. */
const VACUUM_HELD = [
  '..@@@@@.....',
  '.@iimmm@....',
  '@immmmmm@@@.',
  '@immmmmmmm@@',
  '@+mm+++++mm@',
  '@+++++++++@@',
  '.@@@@@@@@@@.',
];

/* 흡입 성능 — 여기 숫자만 바꾸면 난이도가 조절됩니다 */
const VACUUM_RANGE = TILE * 3.2;   // 앞쪽으로 빨아들이는 거리 (약 102px)
const VACUUM_PULL = 2.6;           // 적이 끌려오는 속도 (px/프레임)
const VACUUM_EAT = 20;             // 이만큼 가까워지면 통 안으로 들어갑니다

/* 청소기 노즐 끝 좌표 — 흡입 범위와 그림이 같은 점을 기준으로 삼아야
   "빨리는 것처럼" 보입니다. 따로 계산하면 어긋납니다. */
function vacuumNozzle(p) {
  return {
    x: p.facing > 0 ? p.x + p.w + 10 : p.x - 10,
    y: p.y + p.h * 0.55,
  };
}

const POWERS = {
  vacuum: {
    name: '청소기',
    icon: VACUUM,

    /* 흡입 범위 (사각형). 세로는 나율이 키보다 조금 넉넉하게 잡아
       아이가 대충 겨눠도 빨립니다. */
    zone(p) {
      const h = p.h + 24;
      return {
        x: p.facing > 0 ? p.x + p.w : p.x - VACUUM_RANGE,
        y: p.y - 12,
        w: VACUUM_RANGE,
        h,
      };
    },

    /* 매 프레임 호출됩니다. pressing = 액션 버튼을 누르고 있는가 */
    update(p, game, pressing) {
      const on = !!pressing && !p.dying && p.controllable;

      if (on !== p.actionOn) {
        if (on) Sound.vacuumOn(); else Sound.vacuumOff();
        p.actionOn = on;
      }

      if (!on) {
        /* 버튼을 떼면 붙잡아 두었던 표시를 반드시 풀어야 합니다.
           안 풀면 적이 그 자리에 얼어붙은 채로 남습니다. */
        for (const e of game.entities) if (e.sucked) e.sucked = false;
        return;
      }

      const zone = this.zone(p);
      const noz = vacuumNozzle(p);
      const cx = p.x + p.w / 2;
      const cy = p.y + p.h * 0.55;

      for (const e of game.entities) {
        if (!e.alive) continue;
        const suckable = (e instanceof Walker || e instanceof Flyer) ? !e.dead
          : (e instanceof Coin);
        if (!suckable) continue;

        if (!overlaps(zone, e)) { e.sucked = false; continue; }
        e.sucked = true;

        const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
        const dx = cx - ex, dy = cy - ey;
        const dist = Math.max(1, Math.hypot(dx, dy));

        if (dist < VACUUM_EAT) {
          /* 코인은 원래 충돌 처리에서 먹히므로 여기서는 끌어오기만 합니다 */
          if (e instanceof Coin) continue;
          e.alive = false;
          game.score += SCORE.SUCK;
          Sound.suck();
          game.effects.push(new FloatText(ex, ey, '+' + SCORE.SUCK, '#b8f4ff'));
          for (let i = 0; i < 5; i++) {
            game.effects.push(new Particle(
              noz.x, noz.y,
              (Math.random() - 0.5) * 2.4, (Math.random() - 0.5) * 2.4,
              i % 2 ? '#b8f4ff' : '#4fc8e8', 3, 16
            ));
          }
          continue;
        }

        e.x += (dx / dist) * VACUUM_PULL;
        e.y += (dy / dist) * VACUUM_PULL;
      }

      /* 빨려 들어가는 먼지 — 범위 안에서 노즐 쪽으로 흘러갑니다 */
      if (game.t % 3 === 0) {
        const far = p.facing > 0 ? zone.x + zone.w : zone.x;
        game.effects.push(new SuckDust(
          far - (Math.random() - 0.5) * 40,
          zone.y + Math.random() * zone.h,
          noz.x, noz.y
        ));
      }
    },

    /* 흡입 원뿔 — 나율이보다 뒤에 그려야 얼굴을 가리지 않습니다 */
    drawBehind(ctx, p) {
      if (!p.actionOn) return;
      const noz = vacuumNozzle(p);
      const dir = p.facing > 0 ? 1 : -1;
      const tip = noz.x + dir * VACUUM_RANGE;
      const spread = p.h * 0.5;
      ctx.save();
      for (let i = 0; i < 3; i++) {
        const k = (i + (p.t * 0.06) % 1) / 3;
        ctx.globalAlpha = 0.38 * (1 - k);
        ctx.fillStyle = i % 2 ? '#b8f4ff' : '#4fc8e8';
        ctx.beginPath();
        ctx.moveTo(noz.x, noz.y - 5);
        ctx.lineTo(noz.x + (tip - noz.x) * (0.4 + k * 0.6), noz.y - spread * (0.4 + k));
        ctx.lineTo(noz.x + (tip - noz.x) * (0.4 + k * 0.6), noz.y + spread * (0.4 + k));
        ctx.lineTo(noz.x, noz.y + 5);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    },

    /* 손에 쥔 청소기 */
    drawHeld(ctx, p) {
      const s = 2;
      const w = VACUUM_HELD[0].length * s;
      const shake = p.actionOn ? (p.t % 4 < 2 ? 1 : 0) : 0;
      const x = p.facing > 0 ? p.x + p.w - 10 : p.x - w + 10;
      const y = p.y + p.h * 0.45 + shake;
      drawPixels(ctx, VACUUM_HELD, x, y, s, p.facing < 0);
    },
  },
};


/* ===== js/entities.js ===== */
/* ============================================================
 *  물리 / 충돌 / 등장인물
 * ========================================================== */

/* ─────────── 타일 판정 ─────────── */
function tileChar(level, col, row) {
  if (row < 0 || row >= level.h || col < 0 || col >= level.w) return ' ';
  return level.grid[row][col];
}

function isSolid(level, col, row) {
  if (col < 0 || col >= level.w) return true;   // 화면 좌우 끝은 벽
  if (row < 0 || row >= level.h) return false;  // 위/아래는 뚫려 있음
  return SOLID.indexOf(level.grid[row][col]) >= 0;
}

function isOneWay(level, col, row) {
  return tileChar(level, col, row) === ONEWAY;
}

/* 가로 이동 후 벽 밀어내기 */
function collideX(e, level) {
  const EPS = 0.01;   /* 1px 을 빼면 벽과 바닥에 그만큼 틈이 생겨 떨립니다 */
  const r0 = Math.floor(e.y / TILE);
  const r1 = Math.floor((e.y + e.h - EPS) / TILE);
  if (e.vx > 0) {
    const c = Math.floor((e.x + e.w - EPS) / TILE);
    for (let r = r0; r <= r1; r++) {
      if (isSolid(level, c, r)) {
        e.x = c * TILE - e.w;
        e.vx = 0;
        return true;
      }
    }
  } else if (e.vx < 0) {
    const c = Math.floor(e.x / TILE);
    for (let r = r0; r <= r1; r++) {
      if (isSolid(level, c, r)) {
        e.x = (c + 1) * TILE;
        e.vx = 0;
        return true;
      }
    }
  }
  return false;
}

/* 세로 이동 후 바닥/천장 처리. onBump(col,row) 은 머리로 블록을 칠 때 호출 */
function collideY(e, level, prevBottom, opts) {
  const o = opts || {};
  const EPS = 0.01;
  const c0 = Math.floor(e.x / TILE);
  const c1 = Math.floor((e.x + e.w - EPS) / TILE);
  e.onGround = false;

  if (e.vy > 0) {
    const r = Math.floor((e.y + e.h - EPS) / TILE);
    for (let c = c0; c <= c1; c++) {
      const landsOnSolid = isSolid(level, c, r);
      const landsOnPlatform = !o.ignoreOneWay && isOneWay(level, c, r) && prevBottom <= r * TILE + 2;
      if (landsOnSolid || landsOnPlatform) {
        e.y = r * TILE - e.h;
        e.vy = 0;
        e.onGround = true;
        return 'ground';
      }
    }
  } else if (e.vy < 0) {
    const r = Math.floor(e.y / TILE);
    for (let c = c0; c <= c1; c++) {
      if (isSolid(level, c, r)) {
        e.y = (r + 1) * TILE;
        e.vy = 0;
        if (o.onBump) o.onBump(c, r);
        return 'ceil';
      }
    }
  }

  /* 발이 바닥에 딱 맞게 놓인 프레임에는 위 검사가 아무것도 못 찾아서
     "공중에 떠 있다"고 잘못 판정됩니다. 그래서 평지를 걷는데도 한 프레임씩
     점프 자세가 섞여 나왔습니다. 발 바로 아래 한 칸을 확인해 바로잡습니다. */
  if (!e.onGround && e.vy >= 0) {
    const r = Math.floor((e.y + e.h + 1) / TILE);
    for (let c = c0; c <= c1; c++) {
      const platform = !o.ignoreOneWay && isOneWay(level, c, r) && (e.y + e.h) <= r * TILE + 2;
      if (isSolid(level, c, r) || platform) {
        e.onGround = true;
        e.y = r * TILE - e.h;   /* 바닥에 딱 붙입니다 */
        e.vy = 0;               /* 안 그러면 매 프레임 조금씩 가라앉았다 올라와 떨립니다 */
        break;
      }
    }
  }
  return null;
}

function overlaps(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

/* ─────────────────────────────────────────────
 *  주인공 나율이
 * ───────────────────────────────────────────── */
class Player {
  constructor(x, y) {
    this.big = false;
    this.power = null;     /* 'vacuum' 같은 파워업 종류. 없으면 null */
    this.actionOn = false; /* 액션 버튼을 누르고 있는 중인가 */
    this.w = 24; this.h = 56;
    this.x = x; this.y = y - this.h;
    this.vx = 0; this.vy = 0;
    this.facing = 1;
    this.onGround = false;
    this.coyote = 0;
    this.jumpBuf = 0;
    this.jumping = false;
    this.invuln = 0;
    this.animT = 0;        /* 걸어간 거리. 발 바꾸는 속도를 여기에 맞춥니다 */
    this.skidding = false; /* 달리다 반대 방향을 눌러 미끄러지는 중 */
    this.moved = 0;        /* 이번 프레임에 실제로 움직인 거리 */
    this.t = 0;
    this.blinkTimer = 120 + Math.random() * 180;
    this.dying = false;
    this.dieTimer = 0;
    this.controllable = true;
  }

  setBig(big) {
    const bottom = this.y + this.h;
    this.big = big;
    this.w = big ? 28 : 24;
    this.h = big ? 64 : 56;
    this.y = bottom - this.h;
  }

  /* 파워업을 얻거나(kind) 잃습니다(null).
     마리오 불꽃과 같이 파워를 얻으면 큰 상태도 함께 됩니다. */
  setPower(kind) {
    this.power = kind || null;
    if (kind) this.setBig(true);
    else if (this.actionOn) { Sound.vacuumOff(); this.actionOn = false; }
    const def = kind ? POWERS[kind] : null;
    if (typeof Input !== 'undefined' && Input.setActionLabel) {
      Input.setActionLabel(def ? def.name : '액션');
    }
  }

  get state() {
    if (this.dying) return 'hurt';
    if (!this.onGround) return 'jump';
    if (this.skidding) return 'skid';          /* 달리다 반대로 꺾을 때 */
    if (this.moved > 0.2) return 'run';        /* 실제로 움직였을 때만 걷기 */
    return 'idle';
  }

  update(level, game) {
    this.t++;
    this.blinkTimer--;
    if (this.blinkTimer < -8) this.blinkTimer = 120 + Math.random() * 200;
    if (this.invuln > 0) this.invuln--;

    /* 죽는 중: 위로 튀었다가 아래로 떨어지는 연출 */
    if (this.dying) {
      this.moved = 0;
      this.dieTimer++;
      if (this.dieTimer > 20) {
        this.vy = Math.min(this.vy + PHYS.GRAVITY, PHYS.MAX_FALL);
        this.y += this.vy;
      }
      return;
    }

    const dir = (Input.down.right ? 1 : 0) - (Input.down.left ? 1 : 0);
    const running = Input.down.run;
    const maxSpeed = running ? PHYS.MAX_RUN : PHYS.MAX_WALK;
    const accel = this.onGround ? PHYS.ACCEL : PHYS.AIR_ACCEL;

    /* 가던 방향과 반대를 누르면 미끄러집니다 (마리오의 돌아서기) */
    this.skidding = this.onGround && dir !== 0 && Math.abs(this.vx) > 1.2 &&
      Math.sign(this.vx) !== dir;

    if (this.controllable && dir !== 0) {
      this.vx += dir * accel;
      this.facing = dir;
      if (Math.abs(this.vx) > maxSpeed) this.vx = maxSpeed * Math.sign(this.vx);
    } else {
      this.vx *= this.onGround ? PHYS.FRICTION : 0.985;
      if (Math.abs(this.vx) < 0.05) this.vx = 0;
    }

    /* 점프: 코요테 타임 + 입력 버퍼 (어린이도 쉽게 조작되도록) */
    if (this.controllable && Input.pressed.jump) this.jumpBuf = PHYS.JUMP_BUFFER;
    else this.jumpBuf--;
    this.coyote = this.onGround ? PHYS.COYOTE : this.coyote - 1;

    if (this.jumpBuf > 0 && this.coyote > 0) {
      this.vy = PHYS.JUMP;
      this.jumpBuf = 0;
      this.coyote = 0;
      this.onGround = false;
      this.jumping = true;
      Sound.jump();
    }
    if (this.jumping && !Input.down.jump && this.vy < PHYS.JUMP_CUT) {
      this.vy = PHYS.JUMP_CUT;
      this.jumping = false;
    }
    if (this.vy > 0) this.jumping = false;

    /* 가로 이동 */
    const prevX = this.x;
    this.x += this.vx;
    if (this.x < 0) { this.x = 0; this.vx = 0; }
    collideX(this, level);

    /* 걷기 그림은 "실제로 움직인 거리" 에 맞춰 넘깁니다.
       속도(vx)가 아니라 실제 이동량을 쓰는 이유: 벽에 막혀 제자리걸음일 때
       속도는 있는데 움직이지는 않아서, 그림만 미친 듯이 넘어가 버립니다. */
    this.moved = Math.abs(this.x - prevX);
    if (this.moved < 0.2) this.animT = 0;
    else this.animT += this.moved;

    /* 세로 이동 */
    const prevBottom = this.y + this.h;
    this.prevBottom = prevBottom;
    this.vy = Math.min(this.vy + PHYS.GRAVITY, PHYS.MAX_FALL);
    this.y += this.vy;
    collideY(this, level, prevBottom, {
      ignoreOneWay: Input.down.crouch,
      onBump: (c, r) => game.hitBlock(c, r, this),
    });

    /* 파워업 사용 (청소기 흡입 등).
       적을 끌어당기는 처리가 여기서 일어나야 합니다. 이 뒤에 각 적의 update 가
       돌면서 끌려온 위치를 기준으로 움직이기 때문입니다. */
    const pw = this.power ? POWERS[this.power] : null;
    if (pw && pw.update) pw.update(this, game, Input.down.action);
    else if (this.actionOn) { Sound.vacuumOff(); this.actionOn = false; }

    /* 가시에 닿았는지 */
    const c0 = Math.floor((this.x + 4) / TILE);
    const c1 = Math.floor((this.x + this.w - 5) / TILE);
    const r0 = Math.floor((this.y + 4) / TILE);
    const r1 = Math.floor((this.y + this.h - 2) / TILE);
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        if (tileChar(level, c, r) === HAZARD) { game.hurtPlayer(); return; }
      }
    }

    /* 화면 아래로 떨어짐 */
    if (this.y > VIEW_H + 80) game.killPlayer();
  }

  draw(ctx) {
    const pw = this.power ? POWERS[this.power] : null;
    /* 흡입 원뿔 같은 효과는 나율이보다 먼저 그려야 얼굴을 가리지 않습니다 */
    if (pw && pw.drawBehind) pw.drawBehind(ctx, this);

    /* 무적 중에는 깜빡입니다. 손에 든 물건도 같이 깜빡여야 따로 놀지 않습니다. */
    if (this.invuln > 0 && Math.floor(this.invuln / 4) % 2 === 1) return;

    drawNayul(ctx, this.x, this.y, this.w, this.h, {
      facing: this.facing,
      state: this.state,
      t: this.t,
      walkT: this.animT,
      vy: this.vy,
      big: this.big,
      blink: this.blinkTimer < 0,
    });
    if (pw && pw.drawHeld) pw.drawHeld(ctx, this);
  }
}

/* ─────────── 걸어다니는 적: 밤톨이 ─────────── */
class Walker {
  constructor(col, row, theme) {
    this.theme = theme;     /* 스테이지마다 도트가 다릅니다 (집=먼지뭉치) */
    this.w = 24; this.h = 24;
    this.x = col * TILE + 4;
    this.y = row * TILE + TILE - this.h;
    this.vx = -0.85;
    this.vy = 0;
    this.t = Math.floor(Math.random() * 20);
    this.dead = false;
    this.squash = 0;
    this.alive = true;
    this.sucked = false;   /* 청소기에 빨려 가는 중 */
  }

  update(level) {
    this.t++;
    if (this.dead) {
      this.squash--;
      if (this.squash <= 0) this.alive = false;
      return;
    }
    /* 청소기에 빨려 가는 중에는 스스로 걷지 않습니다.
       (이 update 가 청소기의 끌어당김 뒤에 돌기 때문에, 여기서 안 막으면
        끌어온 위치가 매 프레임 되돌려집니다) */
    if (this.sucked) return;

    this.x += this.vx;
    if (collideX(this, level)) this.vx = -Math.sign(this.vx || 1) * 0.85;

    const prevBottom = this.y + this.h;
    this.vy = Math.min(this.vy + PHYS.GRAVITY, PHYS.MAX_FALL);
    this.y += this.vy;
    collideY(this, level, prevBottom, {});

    /* 낭떠러지 앞에서는 돌아섭니다 (구덩이에 빠지지 않도록) */
    if (this.onGround) {
      const footCol = Math.floor((this.vx > 0 ? this.x + this.w + 2 : this.x - 2) / TILE);
      const footRow = Math.floor((this.y + this.h + 2) / TILE);
      if (!isSolid(level, footCol, footRow) && !isOneWay(level, footCol, footRow)) {
        this.vx = -this.vx;
      }
    }
    if (this.y > VIEW_H + 100) this.alive = false;
  }

  stomp() { this.dead = true; this.squash = 26; this.vx = 0; }

  draw(ctx) {
    drawWalker(ctx, this.x, this.y, this.w, this.h, this.t,
      Math.sign(this.vx) || 1, this.dead, this.theme);
  }
}

/* ─────────── 날아다니는 적: 날개새 ─────────── */
class Flyer {
  constructor(col, row, theme) {
    this.theme = theme;     /* 스테이지마다 도트가 다릅니다 (집=나방) */
    this.w = 26; this.h = 22;
    this.x = col * TILE + 3;
    this.baseY = row * TILE + 5;
    this.y = this.baseY;
    this.startX = this.x;
    this.range = TILE * 3;
    this.vx = -1.15;
    this.t = Math.floor(Math.random() * 40);
    this.dead = false;
    this.squash = 0;
    this.alive = true;
    this.vy = 0;
    this.sucked = false;   /* 청소기에 빨려 가는 중 */
  }

  update(level) {
    this.t++;
    if (this.dead) {
      this.vy += PHYS.GRAVITY;
      this.y += this.vy;
      this.squash--;
      if (this.squash <= 0 || this.y > VIEW_H + 60) this.alive = false;
      return;
    }
    if (this.sucked) return;   /* 청소기에 빨려 가는 중 */
    this.x += this.vx;
    if (Math.abs(this.x - this.startX) > this.range) this.vx = -this.vx;
    if (collideX(this, level)) this.vx = this.vx === 0 ? 1.15 : -Math.sign(this.vx) * 1.15;
    this.y = this.baseY + Math.sin(this.t * 0.05) * 20;
  }

  stomp() { this.dead = true; this.squash = 40; this.vy = -3; }

  draw(ctx) {
    if (this.dead) {
      ctx.save();
      ctx.globalAlpha = 0.7;
      drawFlyer(ctx, this.x, this.y, this.w, this.h, this.t, Math.sign(this.vx) || 1, this.theme);
      ctx.restore();
      return;
    }
    drawFlyer(ctx, this.x, this.y, this.w, this.h, this.t, Math.sign(this.vx) || 1, this.theme);
  }
}

/* ─────────── 코인 ─────────── */
class Coin {
  constructor(col, row) {
    this.w = 20; this.h = 20;
    this.x = col * TILE + 6;
    this.y = row * TILE + 6;
    this.t = Math.floor(Math.random() * 60);
    this.alive = true;
  }
  update() { this.t++; }
  draw(ctx) { drawCoin(ctx, this.x + this.w / 2, this.y + this.h / 2, 10, this.t); }
}

/* 블록에서 튀어나오는 코인 (점수만 주고 사라짐) */
class PopCoin {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vy = -7.5;
    this.t = 0;
    this.alive = true;
  }
  update() {
    this.t++;
    this.vy += 0.5;
    this.y += this.vy;
    if (this.t > 34) this.alive = false;
  }
  draw(ctx) { drawCoin(ctx, this.x, this.y, 10, this.t * 2); }
}

/* ─────────── 하트 아이템 ─────────── */
class HeartItem {
  constructor(col, row) {
    this.w = 24; this.h = 22;
    this.x = col * TILE + 4;
    this.y = row * TILE + 5;
    this.targetY = this.y - TILE;
    this.t = 0;
    this.alive = true;
  }
  update() {
    this.t++;
    if (this.y > this.targetY) this.y -= 1.2;
  }
  draw(ctx) { drawHeart(ctx, this.x + this.w / 2, this.y + this.h / 2, 11, this.t); }
}

/* ─────────── 스테이지 파워업 아이템 (청소기 / 자동차 / 침) ───────────
 * 블록에서 나와 한 칸 떠오른 뒤 그 자리에 있습니다. HeartItem 과 같은 동작입니다. */
class PowerItem {
  constructor(col, row, kind) {
    this.kind = kind;
    this.w = 28; this.h = 28;
    this.x = col * TILE + 2;
    this.y = row * TILE + 4;
    this.targetY = this.y - TILE;
    this.t = 0;
    this.alive = true;
  }
  update() {
    this.t++;
    if (this.y > this.targetY) this.y -= 1.2;
  }
  draw(ctx) {
    const def = POWERS[this.kind];
    if (!def || !def.icon) return;
    const s = 2;
    const bob = Math.round(Math.sin(this.t * 0.09)) * 2;
    /* 반짝이는 뒷광 — 블록에서 나온 게 특별한 물건임을 알려 줍니다 */
    ctx.save();
    ctx.globalAlpha = 0.3 + Math.sin(this.t * 0.12) * 0.12;
    ctx.fillStyle = '#b8f4ff';
    ctx.beginPath();
    ctx.arc(this.x + this.w / 2, this.y + this.h / 2 + bob, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    drawPixels(ctx, def.icon,
      this.x + this.w / 2 - (def.icon[0].length * s) / 2,
      this.y + this.h / 2 - (def.icon.length * s) / 2 + bob, s, false);
  }
}

/* ─────────── 효과: 파편, 점수 글자 ─────────── */
class Particle {
  constructor(x, y, vx, vy, color, size, life) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.color = color; this.size = size || 5;
    this.life = life || 40;
    this.alive = true;
  }
  update() {
    this.vy += 0.42;
    this.x += this.vx;
    this.y += this.vy;
    if (--this.life <= 0) this.alive = false;
  }
  draw(ctx) {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.size, this.size);
  }
}

/* 청소기에 빨려 들어가는 먼지.
 * Particle 은 중력으로 아래로 떨어져서 "빨리는" 느낌이 안 납니다.
 * 그래서 목표 지점(노즐)으로 가속하며 날아가는 전용 효과를 따로 둡니다. */
class SuckDust {
  constructor(x, y, tx, ty) {
    this.x = x; this.y = y;
    this.tx = tx; this.ty = ty;
    this.life = 26;
    this.size = 2 + Math.floor(Math.random() * 3);
    this.alive = true;
  }
  update() {
    const dx = this.tx - this.x, dy = this.ty - this.y;
    const d = Math.max(1, Math.hypot(dx, dy));
    const sp = Math.min(9, 60 / d + 2.4);
    this.x += (dx / d) * sp;
    this.y += (dy / d) * sp;
    if (--this.life <= 0 || d < 8) this.alive = false;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = Math.min(0.75, this.life / 16);
    ctx.fillStyle = this.life % 4 < 2 ? '#e8f8ff' : '#b8f4ff';
    ctx.fillRect(Math.round(this.x), Math.round(this.y), this.size, this.size);
    ctx.restore();
  }
}

class FloatText {
  constructor(x, y, text, color) {
    this.x = x; this.y = y; this.text = text;
    this.color = color || '#fff';
    this.life = 50;
    this.alive = true;
  }
  update() {
    this.y -= 0.9;
    if (--this.life <= 0) this.alive = false;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, this.life / 22);
    ctx.fillStyle = this.color;
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(0,0,0,.55)';
    ctx.lineWidth = 3;
    ctx.strokeText(this.text, this.x, this.y);
    ctx.fillText(this.text, this.x, this.y);
    ctx.restore();
  }
}


/* ===== js/game.js ===== */
/* ============================================================
 *  게임 본체 — 화면 상태, 진행, 그리기
 * ========================================================== */

const Game = {
  canvas: null,
  ctx: null,
  state: 'title',      // title | play | pause | dead | clear | gameover | win
  levelIndex: 0,
  level: null,
  player: null,
  entities: [],
  effects: [],
  bumps: {},
  camX: 0,
  t: 0,
  score: 0,
  coins: 0,
  lives: CONFIG.LIVES,
  timeLeft: 300,
  timeTick: 0,
  deadTimer: 0,
  clearTimer: 0,
  best: 0,

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    Input.init();
    Sound.init();
    try { this.best = parseInt(localStorage.getItem('nayul_best') || '0', 10) || 0; } catch (e) {}
    this.loadLevel(0);
    this.state = 'title';
    requestAnimationFrame((ts) => this.loop(ts));
  },

  /* ── 레벨 불러오기 ───────────────────────── */
  loadLevel(index) {
    const def = LEVELS[index];
    const width = Math.max(...def.rows.map((r) => r.length));
    const grid = [];
    for (let r = 0; r < ROWS; r++) {
      const line = (def.rows[r] || '').padEnd(width, ' ');
      grid.push(line.split(''));
    }

    const level = {
      grid, w: width, h: ROWS,
      theme: def.theme, name: def.name,
      power: def.power || null,     /* `*` 블록에서 나올 파워업 종류 */
      goal: { col: width - 4, row: 13 },
    };

    this.entities = [];
    this.effects = [];
    this.bumps = {};
    let start = { col: 3, row: 13 };

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < width; c++) {
        const ch = grid[r][c];
        if (ch === 'P') { start = { col: c, row: r }; grid[r][c] = ' '; }
        else if (ch === 'E') { this.entities.push(new Walker(c, r, def.theme)); grid[r][c] = ' '; }
        else if (ch === 'F') { this.entities.push(new Flyer(c, r, def.theme)); grid[r][c] = ' '; }
        else if (ch === 'o') { this.entities.push(new Coin(c, r)); grid[r][c] = ' '; }
        else if (ch === 'G') { level.goal = { col: c, row: r }; grid[r][c] = ' '; }
      }
    }

    this.level = level;
    this.levelIndex = index;
    this.player = new Player(start.col * TILE + 4, (start.row + 1) * TILE);
    this.camX = 0;
    this.timeLeft = def.time;
    this.timeTick = 0;
    this.deadTimer = 0;
    this.clearTimer = 0;
    if (Input.setActionLabel) Input.setActionLabel('액션');
    Sound.vacuumOff();
  },

  startGame() {
    this.score = 0;
    this.coins = 0;
    this.lives = CONFIG.LIVES;
    this.loadLevel(0);
    this.state = 'play';
    Sound.start();
    setTimeout(() => { if (this.state === 'play') Sound.startBgm(); }, 500);
  },

  /* ── 한 프레임 진행 ───────────────────────── */
  step() {
    this.t++;

    if (Input.pressed.mute) {
      const muted = Sound.toggleMute();
      this.effects.push(new FloatText(this.camX + VIEW_W / 2, 120, muted ? '소리 끔' : '소리 켬', '#ffd86b'));
    }

    switch (this.state) {
      case 'title':
        if (Input.pressed.jump || Input.pressed.tap) this.startGame();
        break;

      case 'play':
        if (Input.pressed.pause) {
          this.state = 'pause';
          this.player.actionOn = false;
          Sound.vacuumOff();
          Sound.pauseBgm();
          break;
        }
        if (Input.pressed.restart) { this.killPlayer(); break; }
        this.updatePlay();
        break;

      case 'pause':
        if (Input.pressed.pause || Input.pressed.tap) { this.state = 'play'; Sound.startBgm(); }
        break;

      case 'dead':
        this.player.update(this.level, this);
        this.entities.forEach((e) => e.update(this.level));
        this.effects.forEach((e) => e.update());
        this.deadTimer++;
        if (this.deadTimer > 110) {
          this.lives--;
          if (this.lives <= 0) {
            this.state = 'gameover';
            this.saveBest();
          } else {
            this.loadLevel(this.levelIndex);
            this.state = 'play';
            Sound.startBgm();
          }
        }
        break;

      case 'clear':
        this.clearTimer++;
        /* 남은 시간을 점수로 바꿔 줍니다 */
        if (this.timeLeft > 0 && this.clearTimer % 2 === 0) {
          const give = Math.min(this.timeLeft, 3);
          this.timeLeft -= give;
          this.score += give * SCORE.TIME_BONUS;
        }
        this.effects.forEach((e) => e.update());
        this.effects = this.effects.filter((e) => e.alive);
        if (this.clearTimer > 70 && (Input.pressed.jump || Input.pressed.tap)) {
          if (this.levelIndex + 1 < LEVELS.length) {
            this.loadLevel(this.levelIndex + 1);
            this.state = 'play';
            Sound.startBgm();
          } else {
            this.state = 'win';
            this.saveBest();
          }
        }
        break;

      case 'gameover':
      case 'win':
        if (Input.pressed.jump || Input.pressed.tap) {
          this.state = 'title';
          this.loadLevel(0);
        }
        break;
    }

    /* 블록 튕김 애니메이션 */
    Object.keys(this.bumps).forEach((k) => {
      if (--this.bumps[k] <= 0) delete this.bumps[k];
    });
  },

  updatePlay() {
    const p = this.player;
    p.update(this.level, this);
    if (this.state !== 'play') return;   // 도중에 죽었으면 중단

    this.entities.forEach((e) => e.update(this.level));
    this.effects.forEach((e) => e.update());

    /* 등장물과 부딪힘 */
    for (const e of this.entities) {
      if (!e.alive) continue;

      if (e instanceof Coin) {
        if (overlaps(p, e)) {
          e.alive = false;
          this.collectCoin(e.x + e.w / 2, e.y);
        }
      } else if (e instanceof PowerItem) {
        if (overlaps(p, e)) {
          e.alive = false;
          const def = POWERS[e.kind];
          this.score += SCORE.POWERUP;
          Sound.powerup();
          p.setPower(e.kind);
          p.invuln = Math.max(p.invuln, 30);
          this.effects.push(new FloatText(e.x + e.w / 2, e.y, def ? def.name + ' 획득!' : '+' + SCORE.POWERUP, '#b8f4ff'));
          for (let i = 0; i < 14; i++) {
            this.effects.push(new Particle(e.x + 14, e.y + 12, (Math.random() - 0.5) * 6, -Math.random() * 5, i % 2 ? '#b8f4ff' : '#4fc8e8', 4, 34));
          }
        }
      } else if (e instanceof HeartItem) {
        if (overlaps(p, e)) {
          e.alive = false;
          this.score += SCORE.POWERUP;
          Sound.powerup();
          if (!p.big) p.setBig(true);
          else p.invuln = Math.max(p.invuln, 60);
          this.effects.push(new FloatText(e.x + e.w / 2, e.y, '+' + SCORE.POWERUP, '#ff9ec4'));
          for (let i = 0; i < 10; i++) {
            this.effects.push(new Particle(e.x + 12, e.y + 10, (Math.random() - 0.5) * 4, -Math.random() * 4, '#ff9ec4', 4, 30));
          }
        }
      } else if (e instanceof Walker || e instanceof Flyer) {
        if (e.dead || !overlaps(p, e)) continue;
        /* 청소기로 빨아들이는 중인 적은 나율이를 해치지 않습니다.
           이게 없으면 빨아들이다가 자기가 맞아 죽습니다. */
        if (e.sucked) continue;
        /* 밟기 판정: 떨어지는 중이고, 이번 프레임 직전에 적보다 위에 있었으면 밟은 것 */
        const stomping = p.vy > 0.6 &&
          ((p.prevBottom !== undefined && p.prevBottom <= e.y + 10) ||
            (p.y + p.h) - e.y < e.h * 0.6);
        if (stomping) {
          e.stomp();
          p.vy = PHYS.STOMP_BOUNCE;
          p.jumping = true;
          this.score += SCORE.STOMP;
          Sound.stomp();
          this.effects.push(new FloatText(e.x + e.w / 2, e.y, '+' + SCORE.STOMP, '#ffe66d'));
        } else {
          this.hurtPlayer();
          if (this.state !== 'play') return;
        }
      }
    }

    this.entities = this.entities.filter((e) => e.alive);
    this.effects = this.effects.filter((e) => e.alive);

    /* 골 깃발 */
    const g = this.level.goal;
    const goalBox = { x: g.col * TILE - 6, y: (g.row - 4) * TILE, w: TILE + 12, h: TILE * 5 };
    if (overlaps(p, goalBox)) this.clearLevel();

    /* 시간 */
    this.timeTick++;
    if (this.timeTick >= 30) {
      this.timeTick = 0;
      this.timeLeft--;
      if (this.timeLeft <= 0) { this.timeLeft = 0; this.killPlayer(); return; }
    }

    /* 카메라 */
    const target = p.x + p.w / 2 - VIEW_W / 2;
    const maxX = this.level.w * TILE - VIEW_W;
    this.camX = Math.max(0, Math.min(maxX, target));
  },

  collectCoin(x, y) {
    this.coins++;
    this.score += SCORE.COIN;
    Sound.coin();
    this.effects.push(new FloatText(x, y, '+' + SCORE.COIN, '#ffd451'));
    if (this.coins > 0 && this.coins % 25 === 0) {
      this.lives++;
      this.effects.push(new FloatText(x, y - 20, '1UP!', '#8cff9b'));
    }
  },

  /* 머리로 블록 치기 */
  hitBlock(c, r, player) {
    const ch = this.level.grid[r][c];
    const key = c + ',' + r;
    const px = c * TILE + TILE / 2;
    const py = r * TILE;

    if (ch === '?') {
      this.level.grid[r][c] = 'X';
      this.bumps[key] = 10;
      this.effects.push(new PopCoin(px, py - 6));
      this.collectCoin(px, py - 10);
    } else if (ch === '*') {
      /* 스테이지 파워업. 어떤 물건이 나올지는 레벨 정의의 power 가 정합니다 */
      const kind = this.level.power;
      this.level.grid[r][c] = 'X';
      this.bumps[key] = 10;
      if (kind && POWERS[kind]) {
        this.entities.push(new PowerItem(c, r - 1, kind));
        Sound.powerup();
      } else {
        /* 파워가 정해지지 않은 스테이지에서는 하트가 나옵니다 (빈 블록 방지) */
        this.entities.push(new HeartItem(c, r - 1));
        Sound.powerup();
      }
    } else if (ch === '!') {
      this.level.grid[r][c] = 'X';
      this.bumps[key] = 10;
      this.entities.push(new HeartItem(c, r - 1));
      Sound.powerup();
    } else if (ch === 'B') {
      if (player && player.big) {
        this.level.grid[r][c] = ' ';
        this.score += SCORE.BRICK;
        Sound.brick();
        for (let i = 0; i < 8; i++) {
          this.effects.push(new Particle(
            px, py + 14,
            (Math.random() - 0.5) * 6, -Math.random() * 6 - 1,
            i % 2 ? '#c0562f' : '#8f3d20', 6, 46
          ));
        }
      } else {
        this.bumps[key] = 8;
        Sound.bump();
      }
    } else {
      this.bumps[key] = 6;
      Sound.bump();
    }
  },

  hurtPlayer() {
    const p = this.player;
    if (p.invuln > 0 || p.dying) return;
    /* 3단 구조: 파워 → 큰 나율 → 작은 나율 → 죽음 (마리오 불꽃과 같은 방식) */
    if (p.power) {
      const lost = POWERS[p.power] ? POWERS[p.power].name : '파워';
      p.setPower(null);
      p.invuln = PHYS.INVULN;
      Sound.hurt();
      this.effects.push(new FloatText(p.x + p.w / 2, p.y, lost + '을 놓쳤어요!', '#b8f4ff'));
      for (const e of this.entities) if (e.sucked) e.sucked = false;
    } else if (p.big) {
      p.setBig(false);
      p.invuln = PHYS.INVULN;
      Sound.hurt();
      this.effects.push(new FloatText(p.x + p.w / 2, p.y, '앗!', '#fff'));
    } else {
      this.killPlayer();
    }
  },

  killPlayer() {
    const p = this.player;
    if (p.dying) return;
    p.dying = true;
    p.dieTimer = 0;
    p.vy = -9.5;
    p.vx = 0;
    this.state = 'dead';
    this.deadTimer = 0;
    p.actionOn = false;
    Sound.vacuumOff();
    Sound.stopBgm();
    Sound.die();
  },

  clearLevel() {
    if (this.state !== 'play') return;
    this.state = 'clear';
    this.clearTimer = 0;
    this.player.controllable = false;
    this.player.vx = 0;
    this.player.actionOn = false;
    Sound.vacuumOff();
    Sound.stopBgm();
    Sound.clear();
    for (let i = 0; i < 30; i++) {
      this.effects.push(new Particle(
        this.player.x + 10, this.player.y,
        (Math.random() - 0.5) * 9, -Math.random() * 9,
        ['#ffd451', '#ff8fb3', '#8cff9b', '#8fd0ff'][i % 4], 5, 70
      ));
    }
  },

  saveBest() {
    if (this.score > this.best) {
      this.best = this.score;
      try { localStorage.setItem('nayul_best', String(this.best)); } catch (e) {}
    }
  },

  /* ── 그리기 ───────────────────────────────── */
  render() {
    const ctx = this.ctx;
    const lv = this.level;
    drawBackground(ctx, this.camX, lv.theme, this.t);

    ctx.save();
    ctx.translate(-Math.round(this.camX), 0);

    /* 타일 */
    const c0 = Math.max(0, Math.floor(this.camX / TILE) - 1);
    const c1 = Math.min(lv.w - 1, Math.ceil((this.camX + VIEW_W) / TILE) + 1);
    for (let r = 0; r < ROWS; r++) {
      for (let c = c0; c <= c1; c++) {
        const ch = lv.grid[r][c];
        if (ch === ' ') continue;
        const bump = this.bumps[c + ',' + r] || 0;
        const py = r * TILE - (bump > 0 ? Math.sin((bump / 10) * Math.PI) * 9 : 0);
        drawTile(ctx, ch, c * TILE, py, lv.theme, this.t);
        if (ch === '#' && (r === 0 || lv.grid[r - 1][c] === ' ')) {
          drawGrassTop(ctx, c * TILE, py, lv.theme);
        }
      }
    }

    /* 골 깃발 */
    drawGoal(ctx, lv.goal.col * TILE, lv.goal.row * TILE, this.t, lv.theme);

    /* 등장물 */
    this.entities.forEach((e) => e.draw(ctx));
    if (this.state !== 'title') this.player.draw(ctx);
    this.effects.forEach((e) => e.draw(ctx));

    ctx.restore();

    this.drawHUD();

    if (this.state === 'title') this.drawTitle();
    if (this.state === 'pause') this.drawPanel('잠깐 쉬는 중', ['P 키 또는 화면을 누르면 계속'], '#8fd0ff');
    if (this.state === 'clear') this.drawClear();
    if (this.state === 'gameover') this.drawPanel('게임 오버', [
      `점수 ${this.score}`,
      `최고 점수 ${this.best}`,
      '아무 키나 누르면 처음부터',
    ], '#ff8fb3');
    if (this.state === 'win') this.drawPanel(`${CONFIG.PLAYER_NAME}이가 해냈어요!`, [
      '모든 스테이지 클리어 🎉',
      `점수 ${this.score} · 코인 ${this.coins}`,
      `최고 점수 ${this.best}`,
      '아무 키나 누르면 다시 시작',
    ], '#ffd451');
  },

  drawHUD() {
    const ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = 'rgba(12,14,26,.55)';
    ctx.fillRect(0, 0, VIEW_W, 40);
    ctx.font = 'bold 18px sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';

    ctx.fillStyle = '#fff';
    ctx.fillText(`${CONFIG.PLAYER_NAME}`, 16, 21);
    ctx.fillStyle = '#ffd451';
    ctx.fillText(`${this.score}`, 70, 21);

    drawCoin(ctx, 175, 20, 9, this.t);
    ctx.fillStyle = '#fff';
    ctx.fillText(`× ${this.coins}`, 190, 21);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#cfe4ff';
    ctx.fillText(`${this.levelIndex + 1}-${this.level.name}`, VIEW_W / 2, 21);

    ctx.textAlign = 'right';
    ctx.fillStyle = this.timeLeft <= 30 ? '#ff7b7b' : '#fff';
    ctx.fillText(`TIME ${this.timeLeft}`, VIEW_W - 16, 21);

    for (let i = 0; i < Math.min(this.lives, 6); i++) {
      drawHeart(ctx, VIEW_W - 150 - i * 26, 20, 9, 0);
    }

    /* 지금 가지고 있는 파워업 */
    const pw = this.player && this.player.power ? POWERS[this.player.power] : null;
    if (pw && pw.icon) {
      drawPixels(ctx, pw.icon, 250, 4, 2, false);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#b8f4ff';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(pw.name, 286, 21);
    }
    ctx.restore();
  },

  drawTitle() {
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(10,12,24,.55)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    /* 메인 화면에서는 정면을 보고 서 있는 모습을 씁니다 */
    const front = (typeof NAYUL_FRONT96 !== 'undefined') ? NAYUL_FRONT96 : NAYUL96;
    const blinking = Math.floor(this.t / 22) % 9 === 0;
    const art = blinking && front.blink ? front.blink : front.idle;
    drawPixels(ctx, art, VIEW_W / 2 - 96, 46, 2, false);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 52px sans-serif';
    ctx.strokeStyle = 'rgba(0,0,0,.5)';
    ctx.lineWidth = 8;
    ctx.strokeText(CONFIG.TITLE, VIEW_W / 2, 300);
    ctx.fillText(CONFIG.TITLE, VIEW_W / 2, 300);

    ctx.font = 'bold 20px sans-serif';
    ctx.fillStyle = '#ffd451';
    const blink = Math.floor(this.t / 30) % 2 === 0;
    if (blink) ctx.fillText('스페이스 키 (또는 화면 터치) 로 시작!', VIEW_W / 2, 352);

    ctx.font = '15px sans-serif';
    ctx.fillStyle = '#cfd3e6';
    ctx.fillText('← → 이동 · 스페이스 점프 · Shift 달리기 · 적은 밟으면 이겨요!', VIEW_W / 2, 400);
    ctx.fillText(`최고 점수 ${this.best}`, VIEW_W / 2, 426);
  },

  drawClear() {
    const last = this.levelIndex + 1 >= LEVELS.length;
    this.drawPanel(`${this.levelIndex + 1}단계 성공!`, [
      `남은 시간 보너스  ${this.timeLeft}`,
      `점수 ${this.score} · 코인 ${this.coins}`,
      this.clearTimer > 70 ? (last ? '아무 키나 누르면 마지막 축하 화면으로' : '아무 키나 누르면 다음 스테이지') : '',
    ], '#8cff9b');
  },

  drawPanel(title, lines, color) {
    const ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = 'rgba(10,12,24,.62)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    const w = 560, h = 240;
    const x = (VIEW_W - w) / 2, y = (VIEW_H - h) / 2;
    ctx.fillStyle = 'rgba(24,26,44,.95)';
    rr(ctx, x, y, w, h, 18);
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    rr(ctx, x, y, w, h, 18);
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = color;
    ctx.font = 'bold 34px sans-serif';
    ctx.fillText(title, VIEW_W / 2, y + 62);

    ctx.fillStyle = '#e6e9f5';
    ctx.font = '18px sans-serif';
    lines.filter(Boolean).forEach((line, i) => {
      ctx.fillText(line, VIEW_W / 2, y + 108 + i * 32);
    });
    ctx.restore();
  },

  /* ── 메인 루프 (60프레임 고정) ─────────────── */
  loop(ts) {
    if (!this._last) this._last = ts;
    let dt = (ts - this._last) / 1000;
    this._last = ts;
    if (dt > 0.25) dt = 0.25;
    this._acc = (this._acc || 0) + dt;

    let steps = 0;
    while (this._acc >= 1 / 60 && steps < 5) {
      this.step();
      Input.endFrame();
      this._acc -= 1 / 60;
      steps++;
    }

    this.render();
    requestAnimationFrame((t) => this.loop(t));
  },
};

window.addEventListener('load', () => Game.init());

</script>
</html>
