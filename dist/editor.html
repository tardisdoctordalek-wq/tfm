<title>나율이 도트 편집기</title>
<style>
  :root {
    --bg: #f4f2f7; --panel: #ffffff; --ink: #221d2b; --dim: #6b6478;
    --line: #ded8e6; --accent: #d6306a; --accent-soft: #ffe3ee;
    --grid-line: rgba(0,0,0,.10); --shadow: 0 1px 2px rgba(34,29,43,.10);
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17141d; --panel: #211c2a; --ink: #ece7f3; --dim: #a79dba;
      --line: #362e45; --accent: #ff77a8; --accent-soft: #3a1f30;
      --grid-line: rgba(255,255,255,.10); --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17141d; --panel: #211c2a; --ink: #ece7f3; --dim: #a79dba;
    --line: #362e45; --accent: #ff77a8; --accent-soft: #3a1f30;
    --grid-line: rgba(255,255,255,.10); --shadow: 0 1px 2px rgba(0,0,0,.4);
  }

  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    padding-block: 18px; padding-left: 16px; padding-right: 16px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  header h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--dim); font-size: 13px; }

  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button, select {
    font: inherit; font-size: 13px; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px;
    cursor: pointer; box-shadow: var(--shadow);
  }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }

  .main { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); }

  #board { touch-action: none; image-rendering: pixelated; cursor: crosshair; display: block; max-width: 100%; }

  .side { display: flex; flex-direction: column; gap: 12px; min-width: 232px; flex: 1; }
  h2 { font-size: 12px; margin: 0 0 8px; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; }

  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .sw { aspect-ratio: 1; border-radius: 6px; border: 2px solid transparent; cursor: pointer;
        position: relative; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
  .sw.on { border-color: var(--accent); transform: scale(1.08); }
  .sw.empty { background:
      linear-gradient(45deg, var(--line) 25%, transparent 25%, transparent 75%, var(--line) 75%) 0 0/10px 10px,
      linear-gradient(45deg, var(--line) 25%, transparent 25%, transparent 75%, var(--line) 75%) 5px 5px/10px 10px,
      var(--panel); }
  .ramp-label { font-size: 11px; color: var(--dim); margin: 9px 0 4px; }

  .preview { display: flex; gap: 14px; align-items: flex-end; }
  .preview canvas { image-rendering: pixelated; background: #6ec0ff; border-radius: 6px; }
  .preview figure { margin: 0; text-align: center; }
  .preview figcaption { font-size: 11px; color: var(--dim); margin-top: 4px; }

  textarea {
    width: 100%; min-height: 150px; font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px; resize: vertical;
  }
  .hint { font-size: 12px; color: var(--dim); }
  .hint b { color: var(--accent); font-weight: 600; }
  @media (max-width: 720px) { .swatches { grid-template-columns: repeat(8, 1fr); } }
</style>

<div class="wrap">
  <header>
    <h1>나율이 도트 편집기</h1>
    <p>사진을 바탕으로 만든 <b>96 × 96</b> 옆모습 나율이입니다. 고친 뒤 <b>코드 내보내기</b>를 눌러 복사해 주세요.</p>
  </header>

  <div class="bar" id="frameBar"></div>

  <div class="bar">
    <button data-tool="pen" class="on">✏️ 연필</button>
    <button data-tool="erase">🧽 지우개</button>
    <button data-tool="pick">💧 스포이트</button>
    <button data-tool="fill">🪣 채우기</button>
    <div class="sep"></div>
    <button id="undo">↩︎ 되돌리기</button>
    <button id="flip">↔︎ 좌우반전</button>
    <button id="onion">👻 이전 프레임 비치기</button>
    <div class="sep"></div>
    <button id="shift" data-dx="-1">← 이동</button>
    <button id="shiftR" data-dx="1">이동 →</button>
    <button id="shiftU" data-dy="-1">↑ 이동</button>
    <button id="shiftD" data-dy="1">↓ 이동</button>
    <div class="sep"></div>
    <button id="copyFrom">이 프레임에 다른 프레임 복사</button>
    <button id="resize">캔버스 크기</button>
  </div>

  <div class="main">
    <div class="card"><canvas id="board"></canvas></div>

    <div class="side">
      <div class="card">
        <h2>색 (팔레트 안에서만 고르세요)</h2>
        <div id="palette"></div>
      </div>

      <div class="card">
        <h2>미리보기</h2>
        <div class="preview">
          <figure><canvas id="pv2"></canvas><figcaption>실제 게임 크기</figcaption></figure>
          <figure><canvas id="pvAnim"></canvas><figcaption>걷기 재생</figcaption></figure>
          <figure><canvas id="pvSil"></canvas><figcaption>실루엣</figcaption></figure>
        </div>
      </div>

      <div class="card">
        <h2>코드</h2>
        <div class="bar" style="margin-bottom:8px">
          <button id="exportBtn">📋 코드 내보내기</button>
          <button id="importBtn">📥 코드 불러오기</button>
          <button id="reset">처음 상태로</button>
        </div>
        <textarea id="code" spellcheck="false" placeholder="여기에 코드가 나옵니다. 붙여넣고 '코드 불러오기'를 누르면 그림으로 들어옵니다."></textarea>
        <p class="hint" id="status">그린 내용은 이 브라우저에 자동 저장됩니다.</p>
      </div>
    </div>
  </div>

  <p class="hint">
    규칙: 바깥 외곽선은 <b>검정 하나</b>로 두르지 말고 그 부위의 가장 어두운 색으로 —
    머리는 <b>머리 최암부</b>, 피부는 <b>피부 최암부</b>, 옷은 <b>옷 최암부</b>.
    실루엣 미리보기만 보고도 나율이인 게 보이면 잘 그린 겁니다.
  </p>
</div>

let frames = {}, cur = 'idle', color = 'K', tool = 'pen', onion = false;
let W = 20, H = 24, cell = 18, undoStack = [];

function blank(w, h) { return Array.from({ length: h }, () => '.'.repeat(w)); }

function load() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('nayul_editor_side') || 'null'); } catch (e) {}
  const src = saved && saved.frames ? saved.frames : SEED_FRAMES;
  frames = {};
  ORDER.forEach((n) => { if (src[n]) frames[n] = src[n].slice(); });
  if (!frames.idle) frames.idle = blank(W, H);
  W = frames.idle[0].length; H = frames.idle.length;
  ORDER.forEach((n) => { if (!frames[n]) frames[n] = null; });
}

function save() {
  try { localStorage.setItem('nayul_editor_side', JSON.stringify({ frames })); } catch (e) {}
}

/* ── 그리기 ── */
const board = document.getElementById('board');
const bx = board.getContext('2d');

function fit() {
  cell = Math.max(6, Math.min(20, Math.floor(Math.min(640 / W, 620 / H))));
  board.width = W * cell; board.height = H * cell;
}

function paintBoard() {
  bx.clearRect(0, 0, board.width, board.height);
  /* 투명 바탕 체크무늬 */
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    bx.fillStyle = (r + c) % 2 ? '#e9e5ef' : '#f7f5fa';
    bx.fillRect(c * cell, r * cell, cell, cell);
  }
  if (onion) {
    const i = ORDER.indexOf(cur);
    for (let j = i - 1; j >= 0; j--) {
      if (frames[ORDER[j]]) { drawGrid(bx, frames[ORDER[j]], cell, 0.22); break; }
    }
  }
  drawGrid(bx, frames[cur], cell, 1);
  bx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line');
  bx.lineWidth = 1;
  for (let c = 0; c <= W; c++) { bx.beginPath(); bx.moveTo(c * cell + .5, 0); bx.lineTo(c * cell + .5, H * cell); bx.stroke(); }
  for (let r = 0; r <= H; r++) { bx.beginPath(); bx.moveTo(0, r * cell + .5); bx.lineTo(W * cell, r * cell + .5); bx.stroke(); }
}

function drawGrid(ctx, g, s, alpha, flat) {
  if (!g) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  for (let r = 0; r < g.length; r++) for (let c = 0; c < g[r].length; c++) {
    const ch = g[r][c];
    if (ch === '.') continue;
    ctx.fillStyle = flat || SEED_PAL[ch] || '#f0f';
    ctx.fillRect(c * s, r * s, s, s);
  }
  ctx.restore();
}

function setPixel(c, r, ch) {
  if (c < 0 || c >= W || r < 0 || r >= H) return;
  const row = frames[cur][r];
  if (row[c] === ch) return;
  frames[cur][r] = row.slice(0, c) + ch + row.slice(c + 1);
}

function pushUndo() {
  undoStack.push({ f: cur, g: frames[cur].slice() });
  if (undoStack.length > 60) undoStack.shift();
}

function flood(c, r, to) {
  const from = frames[cur][r][c];
  if (from === to) return;
  const q = [[c, r]];
  while (q.length) {
    const [cc, rr] = q.pop();
    if (cc < 0 || cc >= W || rr < 0 || rr >= H) continue;
    if (frames[cur][rr][cc] !== from) continue;
    setPixel(cc, rr, to);
    q.push([cc + 1, rr], [cc - 1, rr], [cc, rr + 1], [cc, rr - 1]);
  }
}

let drawing = false;
function at(e) {
  const b = board.getBoundingClientRect();
  return [Math.floor((e.clientX - b.left) / (b.width / W)), Math.floor((e.clientY - b.top) / (b.height / H))];
}
function apply(e) {
  const [c, r] = at(e);
  if (tool === 'pick') {
    const ch = frames[cur][r] && frames[cur][r][c];
    if (ch && ch !== '.') { color = ch; renderPalette(); }
    return;
  }
  if (tool === 'fill') { flood(c, r, tool === 'erase' ? '.' : color); }
  else setPixel(c, r, tool === 'erase' ? '.' : color);
  paintBoard(); previews();
}
board.addEventListener('pointerdown', (e) => {
  e.preventDefault(); board.setPointerCapture(e.pointerId);
  pushUndo(); drawing = true; apply(e);
});
board.addEventListener('pointermove', (e) => { if (drawing && tool !== 'fill' && tool !== 'pick') apply(e); });
board.addEventListener('pointerup', () => { drawing = false; save(); });
board.addEventListener('pointercancel', () => { drawing = false; });

/* ── 팔레트 ── */
function renderPalette() {
  const host = document.getElementById('palette');
  host.innerHTML = '';
  GROUPS.forEach(([name, keys]) => {
    const lab = document.createElement('div');
    lab.className = 'ramp-label'; lab.textContent = name;
    host.appendChild(lab);
    const grid = document.createElement('div');
    grid.className = 'swatches';
    keys.forEach((k) => {
      const b = document.createElement('button');
      b.className = 'sw' + (color === k ? ' on' : '');
      b.style.background = SEED_PAL[k] || '#f0f';
      b.title = (LABELS[k] || k) + '  (' + k + ')';
      b.setAttribute('aria-label', LABELS[k] || k);
      b.onclick = () => { color = k; tool = 'pen'; syncTools(); renderPalette(); };
      grid.appendChild(b);
    });
    host.appendChild(grid);
  });
}

/* ── 프레임 탭 ── */
function renderFrames() {
  const bar = document.getElementById('frameBar');
  bar.innerHTML = '';
  ORDER.forEach((n) => {
    const b = document.createElement('button');
    const has = !!frames[n];
    b.textContent = (KOR[n] || n) + (has ? '' : ' +');
    b.className = (cur === n ? 'on' : '');
    b.style.opacity = has ? 1 : .55;
    b.onclick = () => {
      if (!frames[n]) frames[n] = (frames[cur] || blank(W, H)).slice();
      cur = n; renderFrames(); paintBoard(); previews(); save();
    };
    bar.appendChild(b);
  });
}

/* ── 미리보기 ── */
const pv2 = document.getElementById('pv2'), pvA = document.getElementById('pvAnim'), pvS = document.getElementById('pvSil');
function previews() {
  [[pv2, 2, false], [pvS, 2, true]].forEach(([cv, s, flat]) => {
    cv.width = W * s; cv.height = H * s;
    const x = cv.getContext('2d');
    x.clearRect(0, 0, cv.width, cv.height);
    drawGrid(x, frames[cur], s, 1, flat ? '#1b1420' : null);
  });
}
let animI = 0;
setInterval(() => {
  const list = ['walk1', 'walk2', 'walk3', 'walk4'].map((n) => frames[n]).filter(Boolean);
  const g = list.length ? list[animI++ % list.length] : frames[cur];
  pvA.width = W * 2; pvA.height = H * 2;
  const x = pvA.getContext('2d');
  x.clearRect(0, 0, pvA.width, pvA.height);
  drawGrid(x, g, 2, 1);
}, 140);

/* ── 도구 버튼 ── */
function syncTools() {
  document.querySelectorAll('[data-tool]').forEach((b) => b.classList.toggle('on', b.dataset.tool === tool));
}
document.querySelectorAll('[data-tool]').forEach((b) => {
  b.onclick = () => { tool = b.dataset.tool; syncTools(); };
});
document.getElementById('undo').onclick = () => {
  const u = undoStack.pop();
  if (!u) return;
  cur = u.f; frames[cur] = u.g;
  renderFrames(); paintBoard(); previews(); save();
};
document.getElementById('flip').onclick = () => {
  pushUndo();
  frames[cur] = frames[cur].map((r) => r.split('').reverse().join(''));
  paintBoard(); previews(); save();
};
document.getElementById('onion').onclick = (e) => {
  onion = !onion; e.currentTarget.classList.toggle('on', onion); paintBoard();
};
function shift(dx, dy) {
  pushUndo();
  const g = frames[cur];
  const out = [];
  for (let r = 0; r < H; r++) {
    const src = g[(r - dy + H) % H];
    out.push(dx === 0 ? src : (dx > 0 ? '.'.repeat(dx) + src.slice(0, W - dx) : src.slice(-dx) + '.'.repeat(-dx)));
  }
  frames[cur] = out; paintBoard(); previews(); save();
}
document.getElementById('shift').onclick = () => shift(-1, 0);
document.getElementById('shiftR').onclick = () => shift(1, 0);
document.getElementById('shiftU').onclick = () => shift(0, -1);
document.getElementById('shiftD').onclick = () => shift(0, 1);

document.getElementById('copyFrom').onclick = () => {
  const from = prompt('어느 프레임을 복사할까요?\n' + ORDER.filter((n) => frames[n]).join(', '));
  if (!from || !frames[from]) return;
  pushUndo(); frames[cur] = frames[from].slice();
  paintBoard(); previews(); save();
};
document.getElementById('resize').onclick = () => {
  const v = prompt('캔버스 크기를 "가로x세로" 로 적어 주세요. 예: 96x96', W + 'x' + H);
  if (!v) return;
  const m = v.match(/(\d+)\s*[x×]\s*(\d+)/);
  if (!m) return;
  const nw = Math.min(128, +m[1]), nh = Math.min(128, +m[2]);
  Object.keys(frames).forEach((n) => {
    if (!frames[n]) return;
    const g = frames[n], out = [];
    const offX = Math.floor((nw - g[0].length) / 2), offY = nh - g.length;   /* 발을 바닥에 맞춤 */
    for (let r = 0; r < nh; r++) {
      let row = '';
      for (let c = 0; c < nw; c++) {
        const sr = r - offY, sc = c - offX;
        row += (g[sr] && g[sr][sc]) ? g[sr][sc] : '.';
      }
      out.push(row);
    }
    frames[n] = out;
  });
  W = nw; H = nh; fit(); paintBoard(); previews(); save();
};

/* ── 코드 주고받기 ── */
document.getElementById('exportBtn').onclick = () => {
  const lines = ['const NAYUL = {'];
  ORDER.forEach((n) => {
    if (!frames[n]) return;
    lines.push('  ' + n + ': [');
    frames[n].forEach((r) => lines.push("    '" + r + "',"));
    lines.push('  ],');
  });
  lines.push('};');
  const text = lines.join('\n');
  document.getElementById('code').value = text;
  const st = document.getElementById('status');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text)
      .then(() => { st.textContent = '복사했습니다. 클로드에게 그대로 붙여넣어 주세요.'; })
      .catch(() => { st.textContent = '아래 칸의 코드를 직접 복사해 주세요.'; });
  } else st.textContent = '아래 칸의 코드를 직접 복사해 주세요.';
};
document.getElementById('importBtn').onclick = () => {
  const text = document.getElementById('code').value;
  const got = {};
  const re = /(\w+)\s*:\s*\[([^\]]*)\]/g;
  let m;
  while ((m = re.exec(text))) {
    const rows = [...m[2].matchAll(/'([^']*)'/g)].map((x) => x[1]);
    if (rows.length > 3) got[m[1]] = rows;
  }
  const names = Object.keys(got);
  if (!names.length) { document.getElementById('status').textContent = '코드를 읽지 못했습니다.'; return; }
  pushUndo();
  frames = {};
  names.forEach((n) => { frames[n] = got[n]; });
  cur = names[0]; W = frames[cur][0].length; H = frames[cur].length;
  fit(); renderFrames(); paintBoard(); previews(); save();
  document.getElementById('status').textContent = names.length + '개 프레임을 불러왔습니다.';
};
document.getElementById('reset').onclick = () => {
  if (!confirm('처음 상태(게임에 들어 있는 그림)로 되돌릴까요? 지금 그린 건 사라집니다.')) return;
  try { localStorage.removeItem('nayul_editor_side'); } catch (e) {}
  load(); fit(); renderFrames(); paintBoard(); previews();
};

/* 키보드 단축키 */
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'b') { tool = 'pen'; syncTools(); }
  if (e.key === 'e') { tool = 'erase'; syncTools(); }
  if (e.key === 'i') { tool = 'pick'; syncTools(); }
  if (e.key === 'g') { tool = 'fill'; syncTools(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); document.getElementById('undo').click(); }
});

load(); fit(); renderPalette(); renderFrames(); paintBoard(); previews();
</script>
