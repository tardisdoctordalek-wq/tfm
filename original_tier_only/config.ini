# ============================================================================
# draft_winrate_penalty - TIER LIST ONLY
# ============================================================================
# The stock config with Feature 1 (the ban/pick AI adjustment) switched off,
# so the mod keeps its own win-rate model and tier assignment and stops
# touching how the competition AI drafts.
#
# Drop this in beside the mod, replacing its config.ini:
#   steamapps\workshop\content\3009300\3741141600\config.ini
# Changes hot-reload within a few seconds; no restart needed.
#
# Two edits from stock, both marked CHANGED below:
#   draft_adjust  true -> false
#   tier_b/tier_c raised, to stop B swallowing the roster
#
# Comments stay on their own lines. The stock file never puts one after a
# value, so whether the mod's parser tolerates a trailing "# ..." is unknown -
# and a value it cannot read falls back to the default, which here would
# quietly switch the ban/pick AI back on.
# ============================================================================

# ============================================================================
# Win-Rate Tiers & Draft AI  -  config
# Saved changes are hot-reloaded within a few seconds (no game restart needed).
# 保存すると数秒以内に自動で再読み込みされます（ゲーム再起動は不要）。
# ============================================================================
#
# This mod has TWO independent features. Turn either off here.
# このModは2つの独立機能を持ちます。どちらかだけ無効にできます。
#   draft_adjust : Feature 1 - adjust the competition AI's ban/pick evaluation
#                  (機能1: 大会AIのBAN/PICK評価を補正)
#   tier_assign  : Feature 2 - set your team's champion Tier list from stats
#                  (機能2: 統計からプレイヤーチームの Tier を設定)
#   enabled      : master switch; false disables BOTH features
#                  (全体マスター。false で両方とも無効)
enabled=true
# CHANGED (stock: true) - Feature 1, the ban/pick AI adjustment, off
draft_adjust=false
tier_assign=true

# ---------------------------------------------------------------------------
# Shared win-rate model (used by both features)
# 共通の勝率モデル（両機能で使用）
# ---------------------------------------------------------------------------
#   neutral : the break-even win rate. Below it = penalty, above it = bonus.
#             Also the center for Bayesian shrink and the tier metric. Default 0.5.
#             (ペナルティとボーナスの境目となる基準勝率。収縮・Tierの中心も兼ねる。既定0.5)
#   wr      = (wins + prior*neutral) / (matches + prior)     # Bayesian shrink to neutral
#   conf    = m / (m + confidence_k)                         # 0..1, smaller for low samples
#   Effective sample m,w = current patch + pf*previous patch (prev = the 1 patch before only)
#     pf = (1 - mc/(mc+confidence_k)) * prev_weight * (mp/(mp+confidence_k))
#     -> previous patch fades as the current patch fills in, and as prev itself is thin.
#
# prior        : Bayesian prior strength (virtual games at 50%). Higher = low-sample champs pulled to neutral.
#                (ベイズ事前の強さ。大きいほど小サンプルを平均へ寄せる)
# confidence_k : confidence factor K. Higher = stronger shrink for low samples.
#                (信頼度係数K。大きいほど小サンプルを強く縮小)
# min_matches  : champions below this effective game count are ignored / No Tier.
#                (この実効試合数未満は対象外 / No Tier)
# solo_weight  : weight of solo-rank stats. Effective games = competition + solo_weight*solo.
#                (ソロランク統計の重み。0=無視 / 0.2=既定 / 1=大会と同等)
# prev_weight  : max blend weight of the previous patch (0 = ignore previous patch).
#                (前パッチ値の最大ブレンド重み。0で前パッチ無視)
# patch_strength : auto buff/nerf bias from the current patch notes (0 = off). A champion buffed in
#                the latest patch gets +patch_strength (bonus), decaying as current-patch games
#                accumulate (same fade as the previous-patch blend).
#                (パッチノートのバフを自動検知して与える初期ボーナス。0で無効。現パッチが溜まるほど減衰。0.25=既定)
# patch_nerf_ratio : nerf penalty strength relative to the buff bonus. Default 0.5 = penalty is half
#                the bonus. Nerf bias = -patch_strength * patch_nerf_ratio * (1 - conf).
#                (ナーフのペナルティ強さをボーナスに対する比率で指定。既定0.5=ペナルティはボーナスの半分)
# patch_prev_weight : how much to still trust the PREVIOUS-patch record of a champion that was
#                buffed/nerfed in the latest patch notes. 0 = ignore prev (old behavior),
#                1 = same as an unchanged champ, default 0.5 = consider it at half weight.
#                (パッチで調整されたキャラの前パッチ戦績の考慮度。0=無視/1=通常/既定0.5=半分。changed_championsは別途完全無視)
# changed_champions : (optional, usually empty) champion_ids changed a lot in the latest patch;
#                listed champs ignore previous-patch data entirely (pf=0). Comma/space separated.
#                (任意・通常は空。直近パッチで大きく変わったキャラを列挙すると前パッチを無視)
#                e.g. changed_champions=fighter, demon
neutral=0.5
prior=10
confidence_k=50
min_matches=5
solo_weight=0.5
prev_weight=0.8
patch_strength=0.1
patch_nerf_ratio=0.5
patch_prev_weight=0.6
changed_champions=

# ---------------------------------------------------------------------------
# Feature 1: Draft AI adjustment (draft_adjust)
# 機能1: ドラフトAI評価の補正
# ---------------------------------------------------------------------------
#   diff = wr - neutral
#   raw  = diff<0 ? -min(-diff*scale, max_pen)      # penalty (<=0)
#                 : +min( diff*bonus_scale, max_bonus) # bonus (>=0)
#   bias = raw * conf   -> added to the native AI draft score
#
# scale       : converts a win-rate deficit into a penalty. scale=10 => -0.10 wr makes -1.0
#               (勝率不足をペナルティへ変換する倍率)
# max_pen     : cap on the penalty magnitude. (ペナルティの上限)
# bonus_scale : converts a win-rate surplus into a bonus. 0 disables bonuses.
#               (勝率超過をボーナスへ変換する倍率。0でボーナス無効)
# max_bonus   : cap on the bonus magnitude. (ボーナスの上限)
# ban_weight  : multiplier for BAN bias (0 = no BAN adjustment). Native BAN score spread is now
#               about as wide as PICK (sd~0.13 vs PICK 0.095), so BAN no longer needs heavy damping.
#               PICK is always x1. (BANに掛ける倍率。BANの素スコアの散らばりはPICKと同程度になったため減衰不要。PICKは常に等倍)
scale=8
max_pen=2
bonus_scale=6
max_bonus=2
ban_weight=1
# BAN behavior: bans assist the vanilla AI rather than override it.
#   - Normal bans: only champions with a penalty >= low_threat_gate get their ban score lowered
#     (so the AI stops wasting bans on weak champs). No bonus is applied on normal bans.
#   - The LAST ban of the ban phase: full bias (bonus + penalty), to remove the biggest threat.
# low_threat_gate : minimum penalty magnitude for a champ to be suppressed on a normal ban.
#                   (通常BANで抑制対象にする最小ペナルティ。最後のBANはこのゲート無視で満額適用)
low_threat_gate=0.3

# ---------------------------------------------------------------------------
# Feature 2: Tier assignment (tier_assign)
# 機能2: Tier分け
# ---------------------------------------------------------------------------
# The "Assign Tier By Stats" button on the Game Info > Champion screen (or auto_tier)
# classifies each champion into S/A/B/C/D and sets your team's Tier list.
# Champions below min_matches become No Tier.
#   metric = adjusted_wr = neutral + (wr - neutral) * conf   # confidence-adjusted win rate
#
# tier_s : adjusted_wr >= tier_s -> S   (e.g. 0.55 = 55%)
# tier_a : adjusted_wr >= tier_a -> A
# tier_b : adjusted_wr >= tier_b -> B
# tier_c : adjusted_wr >= tier_c -> C   (below this -> D)
# auto_tier : true (default) = apply automatically whenever the assignment changes.
#             The manual "Assign Tier By Stats" button is hidden in this mode.
#             false = manual button only.
#             While true, manual Tier edits get overwritten when stats update.
#             (true=自動適用で手動ボタンは非表示。false=ボタン手動のみ。true中は手動変更が上書きされます)
tier_s=0.55
tier_a=0.52
# CHANGED (stock: 0.48) - raised to shrink B
tier_b=0.500
# CHANGED (stock: 0.45) - raised to grow C and D
tier_c=0.478
auto_tier=true

# ---------------------------------------------------------------------------
# Position flexibility bonus (pick phase only)
# レーン柔軟性ボーナス（ピックフェーズのみ）
# ---------------------------------------------------------------------------
# position_flex : bonus strength for multi-lane champions (0.0 = disabled).
#   A champion that plays N lanes gets: position_flex × sqrt((N-1)/4) × conf_comp
#   added to their bias. The bonus scales with remaining ally picks:
#   100% on the 1st ally pick → 0% on the last ally pick (when position is decided).
#   Recommended starting point: 0.3 to 0.5.
#   Scale table (position_flex=0.5, conf_comp=1.0):
#     1 lane: +0.00 (no bonus)
#     2 lanes: +0.25  (@pick1=+0.25, @pick3=+0.12, @pick5=+0.00)
#     3 lanes: +0.35  (@pick1=+0.35, @pick3=+0.18, @pick5=+0.00)
#     5 lanes: +0.50  (@pick1=+0.50, @pick3=+0.25, @pick5=+0.00)
#   (多レーンキャラへの加算ボーナス強度。0=無効。
#    残り味方ピック数でスケール: 1ピック目=100% → 最後ピック=0%)
position_flex=0.2
# min_pos_ratio : a lane is "playable" only if its match count >= total_matches * ratio.
#   Dynamic threshold: adapts to each champion's total game count.
#   e.g. 0.10 = need 10% of total matches in that lane (100 games → 10, 30 games → 3).
#   (レーン「使用可能」判定の比率しきい値。総試合数の ratio 以上必要。動的に変化)
min_pos_ratio=0.10
# min_pos_matches : absolute minimum floor for the lane threshold (regardless of ratio).
#   Default 3.
#   (比率しきい値の絶対下限)
min_pos_matches=10
